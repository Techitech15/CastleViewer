    collar.position.y = groundY; collar.receiveShadow = true;
    g.add(collar);

    var islandShape = new T.Shape();
    islandShape.moveTo(-bailHX,-bailHZ); islandShape.lineTo(bailHX,-bailHZ);
    islandShape.lineTo(bailHX,bailHZ); islandShape.lineTo(-bailHX,bailHZ); islandShape.closePath();
    var islandGeo = new T.ShapeGeometry(islandShape);
    islandGeo.rotateX(-Math.PI/2);
    var island = new T.Mesh(islandGeo, opts.islandMat);
    island.position.y = islandY; island.receiveShadow = true;
    g.add(island);

    var colTop = new T.Color(opts.bankColorTop!=null?opts.bankColorTop:0x9c8a5e);
    var colMid = new T.Color(opts.bankColorMid!=null?opts.bankColorMid:0x6e5c3e);
    var colEdge = new T.Color(opts.bankColorEdge!=null?opts.bankColorEdge:0x332818);

    var bankOuter = buildBankRamp('rect', moatOHX, waterHX, groundY, waterY, colTop, colMid, colEdge, 64, 6, moatOHZ, waterHZ);
    g.add(bankOuter);
    var bankInner = buildBankRamp('rect', bailHX, waterInHX, islandY, waterY, colTop, colMid, colEdge, 64, 6, bailHZ, waterInHZ);
    g.add(bankInner);

    var moatShape = new T.Shape();
    moatShape.moveTo(-waterHX,-waterHZ); moatShape.lineTo(waterHX,-waterHZ);
    moatShape.lineTo(waterHX,waterHZ); moatShape.lineTo(-waterHX,waterHZ); moatShape.closePath();
    var hole = new T.Path();
    hole.moveTo(-waterInHX,-waterInHZ); hole.lineTo(-waterInHX,waterInHZ);
    hole.lineTo(waterInHX,waterInHZ); hole.lineTo(waterInHX,-waterInHZ); hole.closePath();
    moatShape.holes.push(hole);
    var moatGeo = new T.ShapeGeometry(moatShape);
    moatGeo.rotateX(-Math.PI/2);
    var waterMat = new T.MeshPhongMaterial({ color: opts.waterColor||0x2e5b66,
      transparent:true, opacity:opts.waterOpacity!=null?opts.waterOpacity:0.82, shininess:90, specular:0x9fd4e0 });
    var moatWater = new T.Mesh(moatGeo, waterMat);
    moatWater.position.y = waterY;
    g.add(moatWater);

    return { ground:ground, island:island, moatWater:moatWater, waterMat:waterMat,
      waterHalfX:waterHX, waterHalfZ:waterHZ, waterInnerHalfX:waterInHX, waterInnerHalfZ:waterInHZ,
      waterY:waterY, groundY:groundY };
  }

  var BAIL_HX = OHX+3, BAIL_HZ = OHZ+3;
  var MOAT_W = 22;
  var MOAT_OHX = BAIL_HX+MOAT_W, MOAT_OHZ = BAIL_HZ+MOAT_W;
  var GROUND_Y = -1.2, WATER_Y = GROUND_Y - 1.4;

  var rectMoat = buildRectMoatSystem({
    group: group, groundY: GROUND_Y, waterY: WATER_Y,
    bailHalfX: BAIL_HX, bailHalfZ: BAIL_HZ, islandY: 0.02,
    moatOuterHalfX: MOAT_OHX, moatOuterHalfZ: MOAT_OHZ,
    bankWidthOut: 5.5, bankWidthIn: 3.5,
    groundMat: grassMat, islandMat: grassMat2,
    waterColor: WATER_COL,
    bankColorTop: BANK_COL, bankColorMid: BANK_MID_COL, bankColorEdge: BANK_EDGE_COL,
    groundSize: 2400, groundSegs: 96
  });
  var waterMat = rectMoat.waterMat;
  registerPick(pickables, 'structure', 0, WATER_Y+0.1, -MOAT_OHZ+MOAT_W/2, MOAT_OHX*1.6, 1.2, MOAT_W*0.9,
    '水堀 Moat', '石造りの水堀が城壁の全周を囲む。幅約22m。');

  function bridgeOverOuterMoat(axis, fixedCoord, outerCoord, innerCoord, w){
    var len = Math.abs(outerCoord-innerCoord), mid = (outerCoord+innerCoord)/2;
    var br = axis==='z' ? mkBox(w, 0.35, len, woodMat) : mkBox(len, 0.35, w, woodMat);
    if (axis==='z') place(br, fixedCoord, -0.05, mid); else place(br, mid, -0.05, fixedCoord);
    group.add(br);
  }
  bridgeOverOuterMoat('z', 0, -MOAT_OHZ+1.0, -BAIL_HZ-0.5, 5.5);  // north: main approach to Tour du Village
  bridgeOverOuterMoat('z', 0, MOAT_OHZ-1.0, BAIL_HZ+0.5, 4.5);    // south gate approach
  bridgeOverOuterMoat('x', 0, -MOAT_OHX+1.0, -BAIL_HX-0.5, 4.5);  // west gate (Tour du Bois) approach

  /* -------------------------------------------------------------- *
   * info payload + always-on labels (same pattern as buildBodiam)
   * -------------------------------------------------------------- */
  var info = { rooms: donjonFloors.map(function(f){ return { name:f.name, desc:f.desc }; }) };

  var labelGroup = new T.Group();
  labelGroup.visible = false;
  group.add(labelGroup);
  pickables.forEach(function(p){
    var pi = p.userData.pickInfo;
    if (pi.kind !== 'room') return;
    var shortName = pi.name.split(' ')[0];
    var spr = makeTextSprite(shortName, 2.2);
    spr.position.set(p.position.x, p.position.y + 1.6, p.position.z);
    labelGroup.add(spr);
  });

  return { group: group, fadeGroups: fadeGroups, interiorGroup: interiorGroup, info: info,
    pickables: pickables, windowMat: windowMat, waterMats: [waterMat, donjonMoat.waterMat], labelGroup: labelGroup };
}

/* ====================================================================
 * 2. castle registry — add more entries here to extend the viewer.
 *    Each entry's build(THREE) must return
 *    { group, fadeGroups, interiorGroup, info, pickables, labelGroup,
 *      windowMat, waterMats }.
 *
 *    Country fields are DATA, not UI strings baked into markup: the info
 *    panel (#castleMeta), the castle <select> options, and any future
 *    surface all read `country` / `countryJa` / `flag` off the registry
 *    entry (see applyCastle below) so adding a castle here is enough --
 *    no template/markup edits needed elsewhere.
 *      country   : English country name (short, for reference)
 *      countryJa : Japanese country name as shown in the UI
 *      flag      : flag emoji shown next to countryJa
 *      year      : construction year, plain number-as-string (UI appends 年)
 *
 *    A castle with its own square moat can build one via
 *    buildWaterMoatSystem()/buildCircularSkirt() (section 0.5, castle-
 *    agnostic) rather than hand-rolling ground/island/bank/water meshes
 *    -- see buildBodiam's "moat, graded bank, island, approaches" block
 *    for the call shape. A castle with a different water layout (circular
 *    moat, dry ditch, hilltop/no moat) can skip that helper and build its
 *    own environment meshes into its own `group` instead.
 * ==================================================================== */
var CASTLES = [
  {
    id: 'bodiam',
    name: 'Bodiam Castle',
    nameJa: 'ボディアム城',
    country: 'England',
    countryJa: 'イングランド(イギリス)',
    flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
    year: '1385',
    description: '1385年、エドワード・ダリングリッジ卿が築いた水堀に浮かぶ城。四隅に円塔、北に双子塔のゲートハウスを持つ、対称性の高い後期中世城郭建築の代表例。',
    build: buildBodiam,
    // camera / fog / shadow tuning for this castle's scale (section 5 /
    // section 3 read these via applyCastle). These are exactly the values
    // that were previously hardcoded, so Bodiam's behaviour is unchanged.
    view: { targetY: 6.0, zMin: 20, zMax: 150, initDist: 105,
      fogNear: 90, fogFar: 320, shadowExtent: 60, shadowFar: 220 }
  },
  {
    id: 'vincennes',
    name: 'Château de Vincennes',
    nameJa: 'ヴァンセンヌ城',
    country: 'France',
    countryJa: 'フランス',
    flag: '🇫🇷',
    year: '1380',
    description: 'フランス王シャルル5世が14世紀に築いた、高さ52mを誇る欧州最大級のドンジョンと1km超の城壁を持つ中世要塞。パリ郊外の森に建つ王権の象徴。',
    build: buildVincennes,
    // much larger footprint than Bodiam (330x175m enceinte vs. 33m square)
    // -- pull the camera back, extend fog/shadow range, and push the
    // shared background mountain rings out (envScale) so they still read
    // as a distant backdrop rather than sitting inside the zoom clamp.
    view: { targetY: 20, zMin: 60, zMax: 600, initDist: 450,
      fogNear: 300, fogFar: 1200, shadowExtent: 250, shadowFar: 900, envScale: 2.6 }
  }
  // 今後の拡張: 他の城を追加する場合はここに { id, name, nameJa, country,
  // countryJa, flag, year, description, build, view } を追加するだけでよい。
  // 切替ロジック(applyCastle)と国表示は汎用化されているため、レジストリに
  // 追加すれば自動的にUIに反映される。view を省略した場合はボディアムの
  // 既定値(20/150/105/90/320/60/220, envScale 1)にフォールバックする。
];

/* ====================================================================
 * 3. scene / renderer setup
 * ==================================================================== */
var canvas = document.getElementById('stage');
var renderer = new T.WebGLRenderer({ canvas:canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;

var scene = new T.Scene();
// sky is an 8x512 canvas gradient (6 colour stops), repainted every frame
// from the currently-blended time-of-day state -- see section 3.5. Cheap
// enough to repaint continuously (skill: threejs-landscape / "sky dome").
var skyCanvas = document.createElement('canvas');
skyCanvas.width = 8; skyCanvas.height = 512;
var skyCtx = skyCanvas.getContext('2d');
var skyTex = new T.CanvasTexture(skyCanvas);
scene.background = skyTex;
scene.fog = new T.Fog(0xcdddE3, 90, 320);
// per-castle view scale: multiplies every TIME_STATES fog near/far value
// (see applyEnvironment) and the background mountain rings' radius, so a
// much larger castle (e.g. Vincennes) can push fog/mountains out without
// touching the tuned per-time-of-day numbers. Derived in applyCastle from
// view.fogNear/fogFar (relative to Bodiam's own view: 90/320) and
// view.envScale; default 1 leaves everything exactly as today.
var FOG_NEAR_SCALE = 1, FOG_FAR_SCALE = 1, ENV_SCALE = 1;

var camera = new T.PerspectiveCamera(42, 1, 0.5, 1000);

var hemi = new T.HemisphereLight(0xdfe9f2, 0x4a4530, 0.65);
scene.add(hemi);
var sun = new T.DirectionalLight(0xfff2d8, 1.55);
sun.position.set(60, 85, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 220;
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.bias = -0.0012;
scene.add(sun); scene.add(sun.target);
var fill = new T.AmbientLight(0xffffff, 0.22);
scene.add(fill);

/* ====================================================================
 * 3.5 environment layer: time-of-day + weather + background mountains
 *     + rain/snow particles.
 *
 * Built ONCE here, independent of the active castle, so it is reused as
 * castles are switched (no re-creation / no double-dispose risk). Time
 * and weather are each a small state machine that cross-fades between a
 * frozen "from" snapshot and a target preset over TIME_DURATION /
 * WEATHER_DURATION seconds (threejs-landscape: "time of day is
 * interpolation, not a switch" -- switching mid-transition freezes the
 * *current interpolated* values as the new "from", so repeated clicks
 * never jump).
 * ==================================================================== */
function col(hex){ return new T.Color(hex); }

var TIME_STATES = {
  morning: {
    sunPos: new T.Vector3(-95, 32, 24), sunColor: col(0xffd9a0), sunIntensity: 1.15,
    hemiSky: col(0xcfd8e6), hemiGround: col(0x5a4a3a), hemiIntensity: 0.55,
    ambientColor: col(0xfff2df), ambientIntensity: 0.20,
    fogColor: col(0xd9c9b0), fogNear: 90, fogFar: 650,
    sky: [col(0x3f6a92), col(0x7d9dc0), col(0xb9c8c9), col(0xe3c9a0), col(0xf2d9ae), col(0xfbe6c2)],
    waterColor: col(0x3d6472), windowGlow: 0.0, mountainColor: col(0x93a2a0)
  },
  day: {
    sunPos: new T.Vector3(60, 85, 40), sunColor: col(0xfff2d8), sunIntensity: 1.55,
    hemiSky: col(0xdfe9f2), hemiGround: col(0x4a4530), hemiIntensity: 0.65,
    ambientColor: col(0xffffff), ambientIntensity: 0.22,
    fogColor: col(0xcdddE3), fogNear: 140, fogFar: 900,
    sky: [col(0x4f8dc7), col(0x7fb1de), col(0xa7c7e2), col(0xbcd7ea), col(0xd3d8c5), col(0xe7e2c9)],
    waterColor: col(0x2e5b66), windowGlow: 0.0, mountainColor: col(0x7fa898)
  },
  dusk: {
    sunPos: new T.Vector3(-78, 20, -52), sunColor: col(0xff9a56), sunIntensity: 1.05,
    hemiSky: col(0x5b4a6e), hemiGround: col(0x2c2436), hemiIntensity: 0.48,
    ambientColor: col(0xffb37a), ambientIntensity: 0.18,
    fogColor: col(0xaa6f66), fogNear: 90, fogFar: 760,
    sky: [col(0x1c2350), col(0x3a3468), col(0x7a4f74), col(0xc96a52), col(0xe8935a), col(0xf0b378)],
    waterColor: col(0x4a4a5c), windowGlow: 0.4, mountainColor: col(0x4a3c52)
  },
  night: {
    sunPos: new T.Vector3(40, 60, -70), sunColor: col(0xaebfe6), sunIntensity: 0.62,
    hemiSky: col(0x1c2540), hemiGround: col(0x0a0a12), hemiIntensity: 0.40,
    ambientColor: col(0x8fa0cf), ambientIntensity: 0.15,
    fogColor: col(0x0b1220), fogNear: 80, fogFar: 560,
    sky: [col(0x02040c), col(0x050a18), col(0x0a1428), col(0x0d1a34), col(0x111f3c), col(0x182742)],
    waterColor: col(0x16222e), windowGlow: 1.0, mountainColor: col(0x0a1220)
  }
};
var WEATHER_STATES = {
  clear:  { sunMul: 1.00, ambientMul: 1.00, fogNearMul: 1.00, fogFarMul: 1.00, skySatMul: 1.00, rain: 0, snow: 0 },
  cloudy: { sunMul: 0.50, ambientMul: 0.82, fogNearMul: 0.82, fogFarMul: 0.68, skySatMul: 0.42, rain: 0, snow: 0 },
  rain:   { sunMul: 0.38, ambientMul: 0.78, fogNearMul: 0.70, fogFarMul: 0.56, skySatMul: 0.34, rain: 1, snow: 0 },
  snow:   { sunMul: 0.58, ambientMul: 0.85, fogNearMul: 0.60, fogFarMul: 0.48, skySatMul: 0.52, rain: 0, snow: 1 }
};

function cloneTimeState(s){
  return {
    sunPos: s.sunPos.clone(), sunColor: s.sunColor.clone(), sunIntensity: s.sunIntensity,
    hemiSky: s.hemiSky.clone(), hemiGround: s.hemiGround.clone(), hemiIntensity: s.hemiIntensity,
    ambientColor: s.ambientColor.clone(), ambientIntensity: s.ambientIntensity,
    fogColor: s.fogColor.clone(), fogNear: s.fogNear, fogFar: s.fogFar,
    sky: s.sky.map(function(c){ return c.clone(); }),
    waterColor: s.waterColor.clone(), windowGlow: s.windowGlow, mountainColor: s.mountainColor.clone()
  };
}
function blendTime(dst, a, b, t){
  dst.sunPos.copy(a.sunPos).lerp(b.sunPos, t);
  dst.sunColor.copy(a.sunColor).lerp(b.sunColor, t);
  dst.sunIntensity = a.sunIntensity + (b.sunIntensity - a.sunIntensity) * t;
  dst.hemiSky.copy(a.hemiSky).lerp(b.hemiSky, t);
  dst.hemiGround.copy(a.hemiGround).lerp(b.hemiGround, t);
  dst.hemiIntensity = a.hemiIntensity + (b.hemiIntensity - a.hemiIntensity) * t;
  dst.ambientColor.copy(a.ambientColor).lerp(b.ambientColor, t);
  dst.ambientIntensity = a.ambientIntensity + (b.ambientIntensity - a.ambientIntensity) * t;
  dst.fogColor.copy(a.fogColor).lerp(b.fogColor, t);
  dst.fogNear = a.fogNear + (b.fogNear - a.fogNear) * t;
  dst.fogFar = a.fogFar + (b.fogFar - a.fogFar) * t;
  for (var i=0;i<6;i++) dst.sky[i].copy(a.sky[i]).lerp(b.sky[i], t);
  dst.waterColor.copy(a.waterColor).lerp(b.waterColor, t);
  dst.windowGlow = a.windowGlow + (b.windowGlow - a.windowGlow) * t;
  dst.mountainColor.copy(a.mountainColor).lerp(b.mountainColor, t);
}
function cloneWeatherState(s){
  return { sunMul:s.sunMul, ambientMul:s.ambientMul, fogNearMul:s.fogNearMul, fogFarMul:s.fogFarMul, skySatMul:s.skySatMul, rain:s.rain, snow:s.snow };
}
function blendWeather(dst, a, b, t){
  dst.sunMul = a.sunMul + (b.sunMul - a.sunMul) * t;
  dst.ambientMul = a.ambientMul + (b.ambientMul - a.ambientMul) * t;
  dst.fogNearMul = a.fogNearMul + (b.fogNearMul - a.fogNearMul) * t;
  dst.fogFarMul = a.fogFarMul + (b.fogFarMul - a.fogFarMul) * t;
  dst.skySatMul = a.skySatMul + (b.skySatMul - a.skySatMul) * t;
  dst.rain = a.rain + (b.rain - a.rain) * t;

  if (!current || !current.pickables) return [];
  if (lastReveal > 0.28) return current.pickables;
  return current.pickables.filter(function(p){ return p.userData.pickInfo.kind === 'structure'; });
}
function doPick(clientX, clientY){
  if (!current || dragging || ptrs.size >= 2){ return; }
  var rect = canvas.getBoundingClientRect();
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom){ hideTooltip(); return; }
  pickNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pickNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pickNdc, camera);
  var targets = activePickables();
  var hits = targets.length ? raycaster.intersectObjects(targets, false) : [];
  if (hits.length){
    showTooltip(hits[0].object.userData.pickInfo, clientX, clientY);
  } else {
    hideTooltip();
  }
}
function showTooltip(info, x, y){
  tooltipEl.innerHTML = '<div class="tt-title">' + info.name + '</div><div class="tt-desc">' + info.desc + '</div>';
  tooltipEl.style.display = 'block';
  var pad = 16;
  var rectW = tooltipEl.offsetWidth, rectH = tooltipEl.offsetHeight;
  var left = x + pad, top = y + pad;
  if (left + rectW > window.innerWidth - 8) left = x - rectW - pad;
  if (top + rectH > window.innerHeight - 8) top = y - rectH - pad;
  tooltipEl.style.left = Math.max(4,left) + 'px';
  tooltipEl.style.top = Math.max(4,top) + 'px';
}
function hideTooltip(){ tooltipEl.style.display = 'none'; }

/* ====================================================================
 * 6. reveal indicator UI
 * ==================================================================== */
var dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2')];
var revealText = document.getElementById('revealText');
function updateRevealUI(reveal){
  // stage 2 ("内観") now keys off WALL_END rather than the old ROOF_START:
  // walls and roof fade over roughly the same band (Fix 3), so WALL_END
  // is the meaningful "structure is gone" threshold for both.
  var stage = reveal < WALL_START ? 0 : (reveal < WALL_END ? 1 : 2);
  dots.forEach(function(d,i){ d.classList.toggle('on', i<=stage); });
  revealText.textContent = stage===0 ? '外観' : (stage===1 ? '一部カットアウェイ' : '内観');
}

/* -- always-on room labels toggle: independent of the hover tooltip,
 * gated by the same reveal threshold the room pickables use (0.28) so
 * labels only appear once the cutaway has actually opened the interior
 * up. Re-evaluated every frame (reveal changes continuously) and on
 * toggle/castle-switch. -------------------------------------------- */
var labelsOn = false;
function updateLabelVisibility(){
  if (!current || !current.labelGroup) return;
  current.labelGroup.visible = labelsOn && lastReveal > 0.28;
}
document.getElementById('labelToggle').addEventListener('change', function(){
  labelsOn = this.checked;
  updateLabelVisibility();
});

function wireSeg(id, onPick){
  var el = document.getElementById(id);
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ onPick(btn.dataset.k); });
  });
}
wireSeg('timeSeg', setTimeOfDay);
wireSeg('weatherSeg', setWeather);

/* ====================================================================
 * 7. main loop
 * ==================================================================== */
applyCastle(0);
layout();
placeCamera(1);

stepTransitions(0); applyEnvironment(); updateMountains(); // paint the correct sky before the first frame

var prev = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  var k = reducedMotion ? 1 : (1 - Math.pow(0.001, dt));
  placeCamera(k);
  updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, dt);
  updateRevealUI(reveal);
  updateLabelVisibility();
  stepTransitions(dt);
  applyEnvironment();
  updateMountains();
  updateWeatherParticles(dt, camera.position.x, camera.position.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.getElementById('loading').style.display = 'none';
requestAnimationFrame(frame);

/* ====================================================================
 * 8. debug hooks (do not affect production UI)
 * ==================================================================== */
window.__setZoom = function(t){
  // t: 0 (far) .. 1 (near) -> maps to orbDist, snaps instantly (no easing)
  t = Math.max(0, Math.min(1, t));
  orbDist = ZMAX - t*(ZMAX-ZMIN);
  curDist = orbDist;
  placeCamera(1); updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, 1);
  updateRevealUI(reveal);
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__setOrbit = function(az, el){
  orbAz = az; orbEl = Math.max(EL_MIN, Math.min(EL_MAX, el));
  curAz = orbAz; curEl = orbEl;
  placeCamera(1); updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, 1);
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__applyCastle = applyCastle;
window.__setLabels = function(on){
  // testing helper: toggles always-on labels + syncs the UI checkbox,
  // without requiring a real click.
  labelsOn = !!on;
  document.getElementById('labelToggle').checked = labelsOn;
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__findPickScreen = function(nameSubstr){
  // testing helper: projects the first pickable whose tooltip name
  // contains `nameSubstr` to canvas screen coordinates (CSS pixels).
  if (!current || !current.pickables) return null;
  var hit = current.pickables.filter(function(p){ return p.userData.pickInfo.name.indexOf(nameSubstr) >= 0; })[0];
  if (!hit) return null;
  var v = hit.position.clone().project(camera);
  var rect = canvas.getBoundingClientRect();
  return { x: rect.left + (v.x*0.5+0.5)*rect.width, y: rect.top + (1-(v.y*0.5+0.5))*rect.height };
};
window.__setEnv = function(timeKey, weatherKey, instant){
  // testing helper: switches time-of-day / weather, optionally skipping
  // the cross-fade so quality-gate scripts can iterate combinations fast.
  if (timeKey) setTimeOfDay(timeKey);
  if (weatherKey) setWeather(weatherKey);
  if (instant){
    timeTrans.t = 1; CUR_TIME = cloneTimeState(timeTrans.to);
    weatherTrans.t = 1; CUR_WEATHER = cloneWeatherState(weatherTrans.to);
  }
  stepTransitions(0); applyEnvironment(); updateMountains();
  updateWeatherParticles(0, camera.position.x, camera.position.z);
  renderer.render(scene, camera);
};
window.__pickAt = function(clientX, clientY){ doPick(clientX, clientY); };
window.__scene = scene; window.__camera = camera; window.__renderer = renderer;
})();
</script>
</body>
</html>
