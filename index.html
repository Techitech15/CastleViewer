<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ボディアム城 3Dビューア | Bodiam Castle Viewer</title>
<style>
  :root{
    --ink:#eee6d3; --ink2:#b9ae97; --panel:rgba(18,20,16,.62); --panel2:rgba(24,26,20,.72);
    --hair:rgba(238,230,211,.16); --accent:#d7b26a;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#0b0d10;color:var(--ink);font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}
  #stage.drag{cursor:grabbing}

  .glass{background:var(--panel);backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid var(--hair);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}

  #infoPanel{position:absolute;left:16px;top:16px;max-width:340px;padding:16px 18px;z-index:5}
  #infoPanel h1{font-size:18px;margin:0 0 2px;font-weight:700;letter-spacing:.3px;color:var(--ink)}
  #infoPanel .sub{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.4px;margin-bottom:8px}
  #infoPanel p{font-size:12.5px;line-height:1.65;color:var(--ink2);margin:0}

  #castlePanel{position:absolute;right:16px;top:16px;padding:12px 14px;z-index:5;min-width:200px}
  #castlePanel label{display:block;font-size:10.5px;letter-spacing:.6px;color:var(--ink2);
    margin-bottom:6px;text-transform:uppercase}
  #castleSelect{width:100%;background:rgba(255,255,255,.06);color:var(--ink);
    border:1px solid var(--hair);border-radius:8px;padding:7px 9px;font-size:13px;
    font-family:inherit;outline:none}
  #castleSelect option{background:#1b1d18;color:var(--ink)}

  #envPanel{position:absolute;right:16px;top:96px;padding:11px 14px;z-index:5;min-width:200px}
  .segRow{margin-top:9px}
  .segRow:first-child{margin-top:0}
  .segRow label{display:block;font-size:10px;letter-spacing:.6px;color:var(--ink2);
    margin-bottom:5px;text-transform:uppercase}
  .seg{display:flex;gap:4px}
  .seg button{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--hair);color:var(--ink2);
    border-radius:7px;padding:6px 0;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s}
  .seg button:hover{color:var(--ink)}
  .seg button.active{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}

  .toggleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .toggleRow label{margin-bottom:0}
  .switch{position:relative;display:inline-block;width:38px;height:21px;flex:none;cursor:pointer}
  .switch input{position:absolute;z-index:1;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch .track{position:absolute;inset:0;background:rgba(255,255,255,.14);border:1px solid var(--hair);
    border-radius:11px;transition:background .18s,border-color .18s;pointer-events:none}
  .switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:var(--ink2);transition:transform .18s,background .18s;pointer-events:none}
  .switch input:checked ~ .track{background:var(--accent);border-color:var(--accent)}
  .switch input:checked ~ .knob{transform:translateX(17px);background:#1b1712}
  .switch input:focus-visible ~ .track{outline:2px solid var(--accent);outline-offset:2px}

  #hud{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;z-index:5;pointer-events:none}
  #hudInner{pointer-events:auto;padding:10px 20px;display:flex;align-items:center;gap:18px;
    flex-wrap:wrap;justify-content:center}
  #hudInner .guide{font-size:11.5px;color:var(--ink2);letter-spacing:.2px;white-space:nowrap}
  #hudInner .guide b{color:var(--ink);font-weight:600}
  #hudInner .divider{width:1px;height:16px;background:var(--hair)}
  #revealWrap{display:flex;align-items:center;gap:8px}
  #revealWrap .stagesLabel{font-size:11px;color:var(--ink2)}
  .stageDot{display:flex;gap:5px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(238,230,211,.25);transition:background .25s}
  .dot.on{background:var(--accent)}
  #revealText{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--accent);min-width:74px}

  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0d10;z-index:20;font-size:13px;color:var(--ink2);letter-spacing:.4px}

  #tooltip{position:fixed;z-index:30;padding:9px 13px;max-width:260px;pointer-events:none;
    display:none;left:0;top:0}
  #tooltip .tt-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px;letter-spacing:.2px}
  #tooltip .tt-desc{font-size:11.5px;line-height:1.5;color:var(--ink2)}

  @media (max-width:640px){
    #infoPanel{max-width:230px;padding:12px 14px}
    #infoPanel h1{font-size:15px}
    #infoPanel p{font-size:11.5px}
    #castlePanel{min-width:150px}
    #envPanel{min-width:150px;top:88px;padding:9px 12px}
    #hudInner{gap:10px;padding:8px 12px}
    #hudInner .guide{font-size:10px}
    #tooltip{max-width:210px;padding:8px 11px}
    #tooltip .tt-title{font-size:12px}
    #tooltip .tt-desc{font-size:11px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" tabindex="0"></canvas>

  <div id="infoPanel" class="glass">
    <div class="sub" id="castleMeta">🏴󠁧󠁢󠁥󠁮󠁧󠁿 イングランド(イギリス) · 1385年</div>
    <h1 id="castleName">ボディアム城</h1>
    <p id="castleDesc">1385年、エドワード・ダリングリッジ卿が築いた水堀に浮かぶ城。四隅に円塔、北に双子塔のゲートハウスを持つ、対称性の高い後期中世城郭建築の代表例。</p>
  </div>

  <div id="castlePanel" class="glass">
    <label for="castleSelect">城を選択 / SELECT CASTLE</label>
    <select id="castleSelect"></select>
  </div>

  <div id="envPanel" class="glass">
    <div class="segRow">
      <label>時間帯 / TIME</label>
      <div class="seg" id="timeSeg">
        <button type="button" data-k="morning">朝</button>
        <button type="button" data-k="day" class="active">昼</button>
        <button type="button" data-k="dusk">夕</button>
        <button type="button" data-k="night">夜</button>
      </div>
    </div>
    <div class="segRow">
      <label>天候 / WEATHER</label>
      <div class="seg" id="weatherSeg">
        <button type="button" data-k="clear" class="active">晴</button>
        <button type="button" data-k="cloudy">曇</button>
        <button type="button" data-k="rain">雨</button>
        <button type="button" data-k="snow">雪</button>
      </div>
    </div>
    <div class="segRow toggleRow">
      <label for="labelToggle">ラベル常時表示</label>
      <span class="switch">
        <input type="checkbox" id="labelToggle">
        <span class="track"></span>
        <span class="knob"></span>
      </span>
    </div>
    <div class="segRow toggleRow">
      <label for="residentToggle">住人</label>
      <span class="switch">
        <input type="checkbox" id="residentToggle">
        <span class="track"></span>
        <span class="knob"></span>
      </span>
    </div>
  </div>

  <div id="tooltip" class="glass"></div>

  <div id="hud">
    <div id="hudInner" class="glass">
      <div class="guide"><b>ドラッグ</b> = 回転</div>
      <div class="divider"></div>
      <div class="guide"><b>右ドラッグ / Shift+ドラッグ / 2本指ドラッグ</b> = 移動</div>
      <div class="divider"></div>
      <div class="guide"><b>ホイール / ピンチ</b> = ズーム</div>
      <div class="divider"></div>
      <div class="guide">ズームインで壁がフェードし内観が見えます</div>
      <div class="divider"></div>
      <div id="revealWrap">
        <div class="stageDot">
          <div class="dot" id="dot0"></div><div class="dot" id="dot1"></div><div class="dot" id="dot2"></div>
        </div>
        <div id="revealText">外観</div>
      </div>
    </div>
  </div>

  <div id="loading">城を構築中 …</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var T = THREE;
var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ====================================================================
 * 0. small geometry / material helpers
 * ==================================================================== */
function mkBox(w,h,d,mat){
  var m = new T.Mesh(new T.BoxGeometry(w,h,d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function mkCyl(rt,rb,h,seg,mat){
  var m = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function mkCone(r,h,seg,mat){
  var m = new T.Mesh(new T.ConeGeometry(r,h,seg), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function place(mesh,x,y,z,ry){
  mesh.position.set(x,y,z);
  if (ry) mesh.rotation.y = ry;
  return mesh;
}

/* ---- room / structure hover-tooltip picking -------------------------
 * Rooms used to carry an always-visible canvas-sprite label. That is
 * replaced by a hidden pick volume + HTML tooltip (see section 5.5), so
 * this factory builds an invisible raycast target instead of a sprite.
 * The mesh is intentionally never added to the scene graph -- raycasting
 * only needs its world matrix (computed once, it never moves), so it
 * costs zero GPU state and needs no disposal bookkeeping on castle
 * switch (it is simply dropped with the rest of the old `built` object). */
function registerPick(list, kind, x, y, z, w, h, d, name, desc){
  var mesh = new T.Mesh(new T.BoxGeometry(Math.max(w,0.5), Math.max(h,0.5), Math.max(d,0.5)));
  mesh.position.set(x, y, z);
  mesh.updateMatrixWorld(true);
  mesh.userData.pickInfo = { kind: kind, name: name, desc: desc };
  list.push(mesh);
  return mesh;
}

/* cheap deterministic pseudo-noise (sum of sines) -- no external noise
   library, used for both ground undulation and the mountain ridgelines */
function hashNoise2(x, z){
  return Math.sin(x*0.11 + z*0.07)*0.55 + Math.sin(x*0.23 - z*0.17 + 1.7)*0.28 + Math.sin(x*0.05+z*0.031+4.1)*1.0;
}
function ridgeNoise1D(a, seed){
  return Math.sin(a*3 + seed)*0.5 + Math.sin(a*7.3 + seed*1.7)*0.28 +
         Math.sin(a*12.7 + seed*2.3)*0.16 + Math.sin(a*21.1 + seed*3.9)*0.08;
}
function smoothstep01(a,b,x){
  if (b<=a) return x<a?0:1;
  var t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}
/* rolling ground plane: flat out to `flatR` (so the moat/island/bridge
   height relationships never move), then a gentle noise undulation
   fades in over the next 40m so the horizon doesn't read as a dead-flat
   disc once the background mountains (section 3.5) are added.
   `cutHalf` (optional): drop any triangle with a vertex inside the axis-
   aligned square of half-extent `cutHalf` -- used to punch a (grid-
   quantised, slightly generous) hole under a moat/bank system that dips
   below this plane's flat height, so this continuous plane can't poke
   through geometry that's meant to be lower. The caller is responsible
   for covering the resulting hole with its own precise geometry (see
   buildWaterMoatSystem's "collar", section 0.5) -- this function only
   guarantees no ground triangle survives with any vertex inside
   `cutHalf`, it does not fill the gap itself. */
function buildUndulatingGround(flatR, size, segs, mat, cutHalf){
  var geo = new T.PlaneGeometry(size, size, segs, segs);
  geo.rotateX(-Math.PI/2);
  var pos = geo.attributes.position;
  var i;
  for (i=0;i<pos.count;i++){
    var x = pos.getX(i), z = pos.getZ(i);
    var d = Math.hypot(x,z);
    var t = smoothstep01(flatR, flatR+40, d);
    pos.setY(i, hashNoise2(x,z) * 2.2 * t);
  }
  geo.computeVertexNormals();
  if (cutHalf != null){
    var srcIdx = geo.getIndex().array, kept = [];
    for (i=0;i<srcIdx.length;i+=3){
      var a=srcIdx[i], b=srcIdx[i+1], c=srcIdx[i+2];
      var sqA = Math.max(Math.abs(pos.getX(a)), Math.abs(pos.getZ(a)));
      var sqB = Math.max(Math.abs(pos.getX(b)), Math.abs(pos.getZ(b)));
      var sqC = Math.max(Math.abs(pos.getX(c)), Math.abs(pos.getZ(c)));
      if (sqA < cutHalf || sqB < cutHalf || sqC < cutHalf) continue; // any corner inside -> drop the whole face
      kept.push(a,b,c);
    }
    geo.setIndex(kept);
  }
  var mesh = new T.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return mesh;
}

/* two-colour checker texture (e.g. Flemish tile floors); repeat-tiled so
   it reads at any UV scale a BoxGeometry face happens to produce */
function makeCheckerTexture(colorA, colorB, tilesPerSide){
  var cell = 32, n = 2; // 2x2 cell canvas, repeated via texture.repeat
  var c = document.createElement('canvas');
  c.width = c.height = cell*n;
  var ctx = c.getContext('2d');
  ctx.fillStyle = colorA; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = colorB;
  ctx.fillRect(0,0,cell,cell);
  ctx.fillRect(cell,cell,cell,cell);
  var tex = new T.CanvasTexture(c);
  tex.wrapS = T.RepeatWrapping; tex.wrapT = T.RepeatWrapping;
  tex.repeat.set(tilesPerSide||6, tilesPerSide||6);
  tex.magFilter = T.NearestFilter;
  return tex;
}

/* label sprite (canvas-text pill) used by the "always-on labels" toggle
 * (section 6). Castle-agnostic: any castle's room-name strings can use
 * this. depthTest stays on so a label sitting inside a still-solid wall
 * is correctly occluded; it is only ever shown once reveal has faded the
 * relevant walls anyway (see labelGroup visibility gating). */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function makeTextSprite(text, worldHeight){
  var fontSize = 30, padX = 16, padY = 10;
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  ctx.font = '700 ' + fontSize + 'px sans-serif';
  var textW = Math.ceil(ctx.measureText(text).width);
  c.width = textW + padX*2;
  c.height = fontSize + padY*2;
  ctx.font = '700 ' + fontSize + 'px sans-serif'; // canvas resize resets ctx state
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  roundRectPath(ctx, 1, 1, c.width-2, c.height-2, 9);
  ctx.fillStyle = 'rgba(16,17,13,0.72)';
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(238,230,211,0.4)';
  ctx.stroke();
  ctx.fillStyle = '#f2ead6';
  ctx.fillText(text, c.width/2, c.height/2 + 1);
  var tex = new T.CanvasTexture(c);
  var mat = new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  var spr = new T.Sprite(mat);
  var h = worldHeight || 0.9;
  spr.scale.set(h * (c.width/c.height), h, 1);
  return spr;
}

/* always-on label group, built from a castle's `pickables` list. Shared
 * across every castle build() so a new registry entry gets this for free
 * just by populating `pickables` the normal way (registerPick) -- no
 * per-castle label code needed.
 * Every pickable (both 'structure' and 'room' kind) gets a sprite, sized
 * off the pickable's own pick-volume height so it floats just above the
 * tower/room without per-castle tuning. Each sprite is tagged with its
 * kind in userData so updateLabelVisibility (section 6) can gate them
 * independently once the toggle is on: 'structure' labels (towers, gates,
 * walls, ...) show immediately since they're exterior and never occluded
 * by the cutaway; 'room' labels stay gated behind the reveal threshold so
 * they don't float visibly through a still-solid wall. */
function buildLabelGroup(group, pickables){
  var labelGroup = new T.Group();
  labelGroup.visible = false;
  group.add(labelGroup);
  pickables.forEach(function(p){
    var pi = p.userData.pickInfo;
    var shortName = pi.name.split(' ')[0];
    var worldHeight = pi.kind === 'structure' ? 1.4 : 0.85;
    var spr = makeTextSprite(shortName, worldHeight);
    var h = p.geometry.parameters.height;
    spr.position.set(p.position.x, p.position.y + h/2 + 0.6, p.position.z);
    spr.userData.labelKind = pi.kind;
    // pill aspect ratio, kept so the per-frame constant-screen-size
    // rescale in updateLabelVisibility preserves the text proportions
    spr.userData.aspect = spr.scale.x / spr.scale.y;
    labelGroup.add(spr);
  });
  return labelGroup;
}

/* ====================================================================
 * 0.5 water / moat / bank system — castle-agnostic. A square moat
 * ringing a central island, with graded earth banks (not hard box lips)
 * carrying the ground smoothly down to the water on both the outer
 * (field) side and the inner (island) side. Any castle whose footprint
 * is a square moated island can call buildWaterMoatSystem() with its own
 * numbers -- nothing below is Bodiam-specific. A castle with a different
 * water layout (circular moat, dry ditch, no moat) can ignore this
 * helper entirely and build its own environment meshes.
 * ==================================================================== */
function ringPerimPoint(kind, t, extent, extentZ){
  if (kind === 'circle'){
    var a = t * Math.PI * 2;
    return { x: Math.cos(a)*extent, z: Math.sin(a)*extent };
  }
  if (kind === 'rect'){
    // rectangle variant of the 'square' walk below -- independent X/Z half-
    // extents, used by non-square footprints (e.g. Vincennes' 330x175m
    // enceinte). extentZ falls back to `extent` (i.e. behaves like 'square')
    // if omitted, though callers needing a rectangle always pass it.
    var ez = extentZ != null ? extentZ : extent;
    var tt2 = ((t % 1) + 1) % 1 * 4;
    var side2 = Math.floor(tt2), f2 = tt2 - side2;
    var sx = (f2 - 0.5) * 2 * extent, sz = (f2 - 0.5) * 2 * ez;
    if (side2 === 0) return { x: sx, z: -ez };
    if (side2 === 1) return { x: extent, z: sz };
    if (side2 === 2) return { x: -sx, z: ez };
    return { x: -extent, z: -sz };
  }
  // square, walked counter-clockwise starting at the north edge midpoint
  var tt = ((t % 1) + 1) % 1 * 4;
  var side = Math.floor(tt), f = tt - side;
  var s = (f - 0.5) * 2 * extent;
  if (side === 0) return { x: s, z: -extent };
  if (side === 1) return { x: extent, z: s };
  if (side === 2) return { x: -s, z: extent };
  return { x: -extent, z: -s };
}
/* graded ramp ring between two perimeters (concentric squares or
 * circles), vertex-coloured so the bank reads as a continuous slope
 * (dry earth -> darker wet mud at the waterline) rather than a flat tone
 * that stops dead. `extentTop`/`yTop` is the dry edge (u=0), `extentBottom`
 * /`yBottom` is the waterline edge (u=1); the Y profile is eased
 * (smoothstep) so it meets both the flat ground/island above and the
 * flat water below tangentially -- no visible kink at either join. */
function buildBankRamp(kind, extentTop, extentBottom, yTop, yBottom, colTop, colMid, colEdge, segs, steps, extentTopZ, extentBottomZ){
  segs = segs || 48; steps = steps || 6;
  var positions = [], colors = [], indices = [];
  var stride = steps + 1;
  var tmp = new T.Color();
  var i, j;
  for (i=0;i<=segs;i++){
    var t = i/segs;
    var pTop = ringPerimPoint(kind, t, extentTop, extentTopZ);
    var pBot = ringPerimPoint(kind, t, extentBottom, extentBottomZ);
    for (j=0;j<=steps;j++){
      var u = j/steps;
      var eu = smoothstep01(0,1,u);
      positions.push(
        pTop.x + (pBot.x - pTop.x)*eu,
        yTop + (yBottom - yTop)*eu,
        pTop.z + (pBot.z - pTop.z)*eu
      );
      tmp.copy(colTop).lerp(colMid, smoothstep01(0,0.7,u));
      tmp.lerp(colEdge, smoothstep01(0.72,1,u));
      colors.push(tmp.r, tmp.g, tmp.b);
    }
  }
  for (i=0;i<segs;i++){
    for (j=0;j<steps;j++){
      var a = i*stride+j, b = (i+1)*stride+j, c = (i+1)*stride+j+1, d = i*stride+j+1;
      indices.push(a,b,d, b,c,d);
    }
  }
  var geo = new T.BufferGeometry();
  geo.setIndex(indices);
  geo.setAttribute('position', new T.Float32BufferAttribute(positions,3));
  geo.setAttribute('color', new T.Float32BufferAttribute(colors,3));
  geo.computeVertexNormals();
  var mat = new T.MeshLambertMaterial({ vertexColors: T.VertexColors });
  var mesh = new T.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return mesh;
}
/* full moat/bank/island/ground assembly for a square-moated castle.
 * Every mesh is added directly into `opts.group`. Returns the pieces
 * (plus the derived water-ring radii) so the caller can position a
 * bridge/approach against `waterHalf` / `waterInnerHalf`, and register
 * `waterMat` into the build's `waterMats` list for the time-of-day
 * colour hook. See buildBodiam() below for a concrete call + the meaning
 * of every field; a second moated castle only needs its own `opts`. */
function buildWaterMoatSystem(opts){
  var g = opts.group;
  var groundY = opts.groundY, waterY = opts.waterY;
  var islandHalf = opts.islandHalf, islandY = opts.islandY!=null ? opts.islandY : 0.02;
  var moatOuterHalf = opts.moatOuterHalf;
  var bankWOut = opts.bankWidthOut!=null ? opts.bankWidthOut : 4.0;
  var bankWIn = opts.bankWidthIn!=null ? opts.bankWidthIn : 3.0;
  var waterHalf = moatOuterHalf - bankWOut;        // outer edge of open water
  var waterInnerHalf = islandHalf + bankWIn;        // inner edge of open water

  // The outer bank dips WATER_Y below GROUND_Y (Fix 1), so the big
  // continuous ground plane can no longer simply stay flat under the
  // whole moat footprint the way it used to when the moat sat above
  // ground level -- a flat plane there would poke up through the sloped
  // bank / water. Punch a generous, grid-quantised hole in it (any
  // triangle touching the moat's square footprint is dropped) and cover
  // the resulting gap with an exact flat "collar" annulus that meets
  // bankOuter's top ring with zero gap on the inner edge; the ground
  // plane's own flat region is pushed out to start exactly where the
  // collar ends, so the collar's outer edge needs no special handling
  // either (both sides are the same flat GROUND_Y there, hills haven't
  // engaged yet).
  var groundSize = opts.groundSize||1600, groundSegs = opts.groundSegs||72;
  var cellSize = groundSize / groundSegs;
  var collarOuterHalf = moatOuterHalf + Math.max(30, cellSize*2.5);
  var ground = buildUndulatingGround(collarOuterHalf, groundSize, groundSegs, opts.groundMat, moatOuterHalf);
  ground.position.y = groundY;
  g.add(ground);

  var collarShape = new T.Shape();
  collarShape.moveTo(-collarOuterHalf,-collarOuterHalf); collarShape.lineTo(collarOuterHalf,-collarOuterHalf);
  collarShape.lineTo(collarOuterHalf,collarOuterHalf); collarShape.lineTo(-collarOuterHalf,collarOuterHalf); collarShape.closePath();
  var collarHole = new T.Path();
  collarHole.moveTo(-moatOuterHalf,-moatOuterHalf); collarHole.lineTo(-moatOuterHalf,moatOuterHalf);
  collarHole.lineTo(moatOuterHalf,moatOuterHalf); collarHole.lineTo(moatOuterHalf,-moatOuterHalf); collarHole.closePath();
  collarShape.holes.push(collarHole);
  var collarGeo = new T.ShapeGeometry(collarShape);
  collarGeo.rotateX(-Math.PI/2);
  var collar = new T.Mesh(collarGeo, opts.groundMat);
  collar.position.y = groundY; collar.receiveShadow = true;
  g.add(collar);

  var islandShape = new T.Shape();
  islandShape.moveTo(-islandHalf,-islandHalf); islandShape.lineTo(islandHalf,-islandHalf);
  islandShape.lineTo(islandHalf,islandHalf); islandShape.lineTo(-islandHalf,islandHalf); islandShape.closePath();
  var islandGeo = new T.ShapeGeometry(islandShape);
  islandGeo.rotateX(-Math.PI/2);
  var island = new T.Mesh(islandGeo, opts.islandMat);
  island.position.y = islandY; island.receiveShadow = true;
  g.add(island);

  var colTop = new T.Color(opts.bankColorTop!=null?opts.bankColorTop:0x9c8a5e);
  var colMid = new T.Color(opts.bankColorMid!=null?opts.bankColorMid:0x6e5c3e);
  var colEdge = new T.Color(opts.bankColorEdge!=null?opts.bankColorEdge:0x332818);

  // outer bank: dry field (moatOuterHalf, groundY) -> waterline (waterHalf, waterY)
  var bankOuter = buildBankRamp('square', moatOuterHalf, waterHalf, groundY, waterY, colTop, colMid, colEdge);
  g.add(bankOuter);
  // inner bank: island edge (islandHalf, islandY) -> waterline (waterInnerHalf, waterY)
  var bankInner = buildBankRamp('square', islandHalf, waterInnerHalf, islandY, waterY, colTop, colMid, colEdge);
  g.add(bankInner);

  var moatShape = new T.Shape();
  moatShape.moveTo(-waterHalf,-waterHalf); moatShape.lineTo(waterHalf,-waterHalf);
  moatShape.lineTo(waterHalf,waterHalf); moatShape.lineTo(-waterHalf,waterHalf); moatShape.closePath();
  var hole = new T.Path();
  hole.moveTo(-waterInnerHalf,-waterInnerHalf); hole.lineTo(-waterInnerHalf,waterInnerHalf);
  hole.lineTo(waterInnerHalf,waterInnerHalf); hole.lineTo(waterInnerHalf,-waterInnerHalf); hole.closePath();
  moatShape.holes.push(hole);
  var moatGeo = new T.ShapeGeometry(moatShape);
  moatGeo.rotateX(-Math.PI/2);
  var waterMat = new T.MeshPhongMaterial({ color: opts.waterColor||0x2e5b66,
    transparent:true, opacity:opts.waterOpacity!=null?opts.waterOpacity:0.82, shininess:90, specular:0x9fd4e0 });
  var moatWater = new T.Mesh(moatGeo, waterMat);
  moatWater.position.y = waterY;
  g.add(moatWater);

  return { ground:ground, island:island, moatWater:moatWater, bankOuter:bankOuter, bankInner:bankInner,
    waterMat:waterMat, waterHalf:waterHalf, waterInnerHalf:waterInnerHalf, waterY:waterY, groundY:groundY };
}
/* small circular skirt bank -- same grading technique as the main moat
 * banks, sized for a small mid-moat platform (e.g. a drawbridge island)
 * so it also meets the water on a slope instead of a hard disc edge. */
function buildCircularSkirt(cx, cz, rTop, rBottom, yTop, yBottom, colTop, colMid, colEdge){
  var ramp = buildBankRamp('circle', rTop, rBottom, yTop, yBottom, colTop, colMid, colEdge, 32, 5);
  ramp.position.set(cx, 0, cz);
  return ramp;
}

/* ====================================================================
 * 1. Bodiam Castle procedural builder
 * ====================================================================
 * Returns { group, fadeGroups, interiorGroup, info }.
 * fadeGroups is a flat array of descriptors so the reveal/cutaway loop
 * (section 4) can stay generic across any castle added to the registry:
 *   { group: THREE.Group, mat: THREE.Material, dir: {x,z}|null, roof: bool, op: number }
 * `dir` is the outward-facing unit vector used for camera-facing tests;
 * `roof` marks groups that also fade out completely (independent of
 * camera azimuth) once the viewer is close enough to see the room plan.
 */
function buildBodiam(){
  var group = new T.Group();
  var interiorGroup = new T.Group();
  group.add(interiorGroup);
  var fadeGroups = [];
  var pickables = [];   // hover/tap tooltip targets: rooms + major structures

  function makeFadeGroup(name, dir, isRoof, colorHex, roughness){
    var mat = new T.MeshLambertMaterial({ color: colorHex });
    var g = new T.Group();
    g.name = name;
    group.add(g);
    var desc = { group:g, mat:mat, dir:dir, roof: !!isRoof, op:1, name:name };
    fadeGroups.push(desc);
    return desc;
  }

  /* ---- palette : Sussex sandstone, warm ochre to grey ------------- */
  var STONE_WALL   = 0xc7a97c;
  var STONE_WALL_V = 0xbfa176; // slight variance for towers
  var STONE_DARK   = 0x9c8564;
  var ROOF_COL     = 0x5b544a;
  var TIMBER_COL   = 0x5b4530;
  var WINDOW_COL   = 0x1c150e;
  var FLOOR_COL    = 0xa89a80;
  var STUB_COL     = 0x7c6c50;
  var WOOD_COL     = 0x6b4f34;
  var METAL_COL    = 0x2a2925;
  var WATER_COL    = 0x2e5b66;
  var GRASS_COL    = 0x5c7a48;
  var GRASS_COL2   = 0x6c8a52;
  var BANK_COL     = 0x8a7a58;
  var BANK_MID_COL = 0x62543a; // bank ramp, mid-slope
  var BANK_EDGE_COL= 0x2f2617; // bank ramp, wet mud right at the waterline
  var TILE_COL     = 0x7a5240;
  var COURT_GRASS_COL = 0x6a8d4f; // central lawn, kept distinct from the wing stone floors

  var windowMat = new T.MeshLambertMaterial({ color: WINDOW_COL });
  var floorMat  = new T.MeshLambertMaterial({ color: FLOOR_COL }); // stone slab under each wing (grey-sand, one step above the lawn)
  var stubMat   = new T.MeshLambertMaterial({ color: STUB_COL, side: T.DoubleSide });
  var partitionMat = new T.MeshLambertMaterial({ color: 0x8a7a5e, side: T.DoubleSide }); // room-dividing stub walls
  var woodMat   = new T.MeshLambertMaterial({ color: WOOD_COL });
  var metalMat  = new T.MeshLambertMaterial({ color: METAL_COL });
  var tileMat   = new T.MeshLambertMaterial({ color: TILE_COL });
  var grassMat  = new T.MeshLambertMaterial({ color: GRASS_COL });
  var grassMat2 = new T.MeshLambertMaterial({ color: GRASS_COL2 });
  var courtGrassMat = new T.MeshLambertMaterial({ color: COURT_GRASS_COL });
  var bankMat   = new T.MeshLambertMaterial({ color: BANK_COL });
  var wellMat   = new T.MeshBasicMaterial({ color: 0x2e6a7a });

  /* ---- footprint constants (metres) -------------------------------- */
  var OW = 16.5;      // outer curtain wall half-extent (33m side)
  var WT = 1.6;        // wall thickness
  var WH = 10.6;       // wall height to the wall-walk
  var MER = 1.3;        // merlon height

  var CORNER_R = 4.6, CORNER_H = 17.6, CORNER_ROOF_H = 2.7;
  var MID_W = 7.2, MID_PROJ = 4.2, MID_H = 13.6, MID_ROOF_H = 2.3;
  var GATE_W = 6.3, GATE_PROJ = 4.8, GATE_H = 15.4, GATE_ROOF_H = 2.5, GATE_GAP = 4.6;

  var INNER = OW - WT; // inner wall face

  /* ---- fade group registry ------------------------------------------ */
  var wallN = makeFadeGroup('wallN', {x:0,z:-1}, false, STONE_WALL);
  var wallS = makeFadeGroup('wallS', {x:0,z:1},  false, STONE_WALL);
  var wallE = makeFadeGroup('wallE', {x:1,z:0},  false, STONE_WALL);
  var wallW = makeFadeGroup('wallW', {x:-1,z:0}, false, STONE_WALL);

  var tNE = makeFadeGroup('towerNE', norm(1,-1),  false, STONE_WALL_V);
  var tNW = makeFadeGroup('towerNW', norm(-1,-1), false, STONE_WALL_V);
  var tSE = makeFadeGroup('towerSE', norm(1,1),   false, STONE_WALL_V);
  var tSW = makeFadeGroup('towerSW', norm(-1,1),  false, STONE_WALL_V);

  var tS  = makeFadeGroup('towerS_postern', {x:0,z:1},  false, STONE_WALL_V);
  var tE  = makeFadeGroup('towerE_mid',     {x:1,z:0},  false, STONE_WALL_V);
  var tW  = makeFadeGroup('towerW_mid',     {x:-1,z:0}, false, STONE_WALL_V);
  var tG1 = makeFadeGroup('gateTowerW', norm(-0.32,-1), false, STONE_WALL_V);
  var tG2 = makeFadeGroup('gateTowerE', norm(0.32,-1),  false, STONE_WALL_V);

  var roofS = makeFadeGroup('roofS', {x:0,z:1},  true, ROOF_COL);
  var roofE = makeFadeGroup('roofE', {x:1,z:0},  true, ROOF_COL);
  var roofW = makeFadeGroup('roofW', {x:-1,z:0}, true, ROOF_COL);
  var roofN = makeFadeGroup('roofN', {x:0,z:-1}, true, ROOF_COL);
  var roofCaps = makeFadeGroup('roofCaps', null, true, ROOF_COL); // conical tower roofs (no direction test)

  function norm(x,z){ var l = Math.hypot(x,z)||1; return {x:x/l, z:z/l}; }

  /* -------------------------------------------------------------- *
   * curtain walls with crenellations
   * -------------------------------------------------------------- */
  function addCrenellations(target, mat, cx, cz, length, ry, topY, thickness){
    var merlonW = 1.15, gapW = 1.05, mt = thickness*0.72;
    var period = merlonW + gapW;
    var count = Math.max(1, Math.floor(length/period));
    var start = -(count*period)/2 + merlonW/2;
    var co = Math.cos(ry), si = Math.sin(ry);
    for (var i=0;i<count;i++){
      var lx = start + i*period;
      var wx = cx + lx*co, wz = cz - lx*si;
      var m = mkBox(merlonW, MER, mt, mat);
      place(m, wx, topY + MER/2, wz, ry);
      target.add(m);
    }
  }
  function addWindows(target, mat, cx, cz, length, ry, midY, thickness, windows){
    var co = Math.cos(ry), si = Math.sin(ry);
    (windows||[]).forEach(function(w){
      var win = mkBox(w.w, w.h, thickness*1.05, mat);
      var wx = cx + w.x*co, wz = cz - w.x*si;
      place(win, wx, midY + (w.dy||0), wz, ry);
      target.add(win);
    });
  }
  function buildStraightWall(fg, cx, cz, length, ry, windows){
    var wall = mkBox(length, WH, WT, fg.mat);
    place(wall, cx, WH/2, cz, ry);
    fg.group.add(wall);
    addCrenellations(fg.group, fg.mat, cx, cz, length, ry, WH, WT);
    if (windows) addWindows(fg.group, windowMat, cx, cz, length, ry, WH*0.62, WT, windows);
  }

  // North wall: split either side of the gatehouse gap
  var halfGate = GATE_GAP/2 + GATE_W; // where the solid wall resumes past the twin towers
  var nSegLen = OW - halfGate;
  buildStraightWall(wallN, -(halfGate + nSegLen/2), -OW, nSegLen, 0, [{x:-nSegLen*0.25,w:1.5,h:2.6,dy:1.0},{x:nSegLen*0.15,w:1.3,h:2.2,dy:1.0}]);
  buildStraightWall(wallN,  (halfGate + nSegLen/2), -OW, nSegLen, 0, [{x:nSegLen*0.25,w:1.5,h:2.6,dy:1.0},{x:-nSegLen*0.15,w:1.3,h:2.2,dy:1.0}]);

  // South wall: continuous, postern tower sits proud of it, plus door slot
  buildStraightWall(wallS, 0, OW, 2*OW, Math.PI, [{x:-9.5,w:2.2,h:3.4,dy:1.4},{x:9.5,w:2.2,h:3.4,dy:1.4}]);

  // East wall: has the chapel bulge (built in courtyard section) + windows
  buildStraightWall(wallE, OW, 0, 2*OW, -Math.PI/2, [
    {x:-8.0,w:1.6,h:3.2,dy:1.2},{x:-3.0,w:1.6,h:3.2,dy:1.2},
    {x:3.0,w:1.6,h:3.4,dy:1.2},{x:8.0,w:1.8,h:3.6,dy:1.0}
  ]);
  // chapel bulge: curtain wall projects 2.7m toward the moat here
  (function(){
    var bulgeCz = -OW*0.32, bulgeSpan = 6.4, bulgeProj = 2.7;
    var bx = OW + bulgeProj/2;
    var b = mkBox(bulgeProj + WT, WH, bulgeSpan, wallE.mat);
    place(b, bx - WT/2, WH/2, bulgeCz, 0);
    wallE.group.add(b);
    addCrenellations(wallE.group, wallE.mat, OW+bulgeProj, bulgeCz, bulgeSpan, -Math.PI/2, WH, WT);
    addCrenellations(wallE.group, wallE.mat, bx-WT/2, bulgeCz-bulgeSpan/2-0.05, bulgeProj, 0, WH, WT*0.7);
    addCrenellations(wallE.group, wallE.mat, bx-WT/2, bulgeCz+bulgeSpan/2+0.05, bulgeProj, Math.PI, WH, WT*0.7);
    var win = mkBox(1.6,3.0,0.3, windowMat);
    place(win, OW+bulgeProj-0.05, WH*0.6, bulgeCz, -Math.PI/2);
    wallE.group.add(win);
  })();

  // West wall: continuous, no windows (Bodiam's blind west face)
  buildStraightWall(wallW, -OW, 0, 2*OW, Math.PI/2, []);

  /* -------------------------------------------------------------- *
   * round corner towers
   * -------------------------------------------------------------- */
  function buildCornerTower(fg, cx, cz){
    var shaft = mkCyl(CORNER_R, CORNER_R*1.06, CORNER_H, 16, fg.mat);
    place(shaft, cx, CORNER_H/2, cz);
    fg.group.add(shaft);
    var plinth = mkCyl(CORNER_R*1.1, CORNER_R*1.22, 1.2, 16, fg.mat);
    place(plinth, cx, 0.6, cz);
    fg.group.add(plinth);
    var n = 14;
    for (var i=0;i<n;i+=2){
      var a = (i/n)*Math.PI*2;
      var m = mkBox(CORNER_R*0.32, MER, CORNER_R*0.32, fg.mat);
      place(m, cx+Math.cos(a)*CORNER_R, CORNER_H+MER/2, cz+Math.sin(a)*CORNER_R, -a);
      fg.group.add(m);
    }
    // arrow-loop windows, 3 storeys
    for (var s=0;s<3;s++){
      for (var k=0;k<4;k++){
        var ang = k*Math.PI/2 + Math.PI/4;
        var wm = mkBox(0.4, 1.6, 0.5, windowMat);
        place(wm, cx+Math.cos(ang)*CORNER_R*0.98, 3.2+s*4.6, cz+Math.sin(ang)*CORNER_R*0.98, -ang);
        fg.group.add(wm);
      }
    }
    var roof = mkCone(CORNER_R*1.18, CORNER_ROOF_H, 16, roofCaps.mat);
    place(roof, cx, CORNER_H+MER+CORNER_ROOF_H/2, cz);
    roofCaps.group.add(roof);
  }
  buildCornerTower(tNE, OW, -OW);
  buildCornerTower(tNW, -OW, -OW);
  buildCornerTower(tSE, OW, OW);
  buildCornerTower(tSW, -OW, OW);
  // exterior structure tooltips (always pickable, not gated by reveal)
  var TOWER_PICK = CORNER_R*2.5;
  registerPick(pickables, 'structure', -OW, CORNER_H/2, -OW, TOWER_PICK, CORNER_H, TOWER_PICK,
    '北西塔 Northwest Tower', '各階に暖炉と厠(ガーダローブ)を備えた三層の円塔。伝承では牢獄塔とも呼ばれる。');
  registerPick(pickables, 'structure', OW, CORNER_H/2, -OW, TOWER_PICK, CORNER_H, TOWER_PICK,
    '北東塔 Northeast Tower', '三層の円塔。礼拝堂を収めるため東の城壁がここで堀側へ張り出す。');
  registerPick(pickables, 'structure', OW, CORNER_H/2, OW, TOWER_PICK, CORNER_H, TOWER_PICK,
    '南東塔 Southeast Tower', '三層の円塔。各階に矢狭間(アロー・ループ)を持つ。');
  registerPick(pickables, 'structure', -OW, CORNER_H/2, OW, TOWER_PICK, CORNER_H, TOWER_PICK,
    '南西塔 Southwest Tower', '地下に井戸を持ち、館全体に水を供給した円塔。');

  /* -------------------------------------------------------------- *
   * rectangular mid-wall towers (E / W / S-postern)
   * -------------------------------------------------------------- */
  function buildMidTower(fg, cx, cz, ry, opts){
    opts = opts || {};
    var h = opts.h || MID_H, roofH = opts.roofH || MID_ROOF_H, w = opts.w || MID_W, proj = opts.proj || MID_PROJ;
    var body = mkBox(w, h, proj, fg.mat);
    place(body, cx, h/2, cz, ry);
    fg.group.add(body);
    addCrenellations(fg.group, fg.mat, cx, cz, w, ry, h, proj);
    var roof = mkCone(Math.max(w,proj)*0.72, roofH, 4, roofCaps.mat);
    roof.rotation.y = Math.PI/4 + ry;
    place(roof, cx, h+MER+roofH/2, cz);
    roofCaps.group.add(roof);
    if (opts.window){
      var win = mkBox(1.6, 2.8, 0.35, windowMat);
      var dz = opts.window.outward ? proj/2 : 0;
      var co=Math.cos(ry), si=Math.sin(ry);
      place(win, cx+dz*si, h*0.5, cz+dz*co, ry);
      fg.group.add(win);
    }
  }
  // south postern tower: proud of south wall, drawbridge + machicolation implied by a lip
  buildMidTower(tS, 0, OW+MID_PROJ/2-0.4, Math.PI, {window:{outward:true}});
  var posternLip = mkBox(MID_W*0.9, 0.5, 0.9, tS.mat);
  place(posternLip, 0, MID_H+0.2, OW+MID_PROJ-0.3, Math.PI);
  tS.group.add(posternLip);
  registerPick(pickables, 'structure', 0, MID_H/2, OW+MID_PROJ/2-0.4, MID_W*1.5, MID_H, MID_PROJ*2.2,
    'ポスタン塔 Postern Tower', '南壁中央の裏門。跳ね橋と木橋で堀の南岸と結ばれる。');
  // east & west mid towers
  buildMidTower(tE, OW+MID_PROJ/2-0.4, 0, -Math.PI/2, {window:{outward:true}});
  buildMidTower(tW, -(OW+MID_PROJ/2-0.4), 0, Math.PI/2, {});
  registerPick(pickables, 'structure', OW+MID_PROJ/2-0.4, MID_H/2, 0, 7, MID_H, 7,
    '中間塔 Mid-wall Tower', '城壁の中間に張り出す方形塔。側面からの攻撃に対する防御を強化する。');
  registerPick(pickables, 'structure', -(OW+MID_PROJ/2-0.4), MID_H/2, 0, 7, MID_H, 7,
    '中間塔 Mid-wall Tower', '城壁の中間に張り出す方形塔。側面からの攻撃に対する防御を強化する。');

  /* -------------------------------------------------------------- *
   * twin gatehouse towers (north)
   * -------------------------------------------------------------- */
  function buildGateTower(fg, cx, cz){
    var body = mkBox(GATE_W, GATE_H, GATE_PROJ, fg.mat);
    place(body, cx, GATE_H/2, cz, 0);
    fg.group.add(body);
    // machicolated lip near top (jutting course over the gate)
    var lip = mkBox(GATE_W*1.08, 0.6, GATE_PROJ*1.1, fg.mat);
    place(lip, cx, GATE_H-0.5, cz, 0);
    fg.group.add(lip);
    addCrenellations(fg.group, fg.mat, cx, cz, GATE_W, 0, GATE_H, GATE_PROJ);
    var roof = mkCone(GATE_W*0.62, GATE_ROOF_H, 4, roofCaps.mat);
    roof.rotation.y = Math.PI/4;
    place(roof, cx, GATE_H+MER+GATE_ROOF_H/2, cz);
    roofCaps.group.add(roof);
    for (var s=0;s<3;s++){
      var wm = mkBox(0.5,1.6,0.4, windowMat);
      place(wm, cx, 3.4+s*4.2, cz-GATE_PROJ/2+0.02, 0);
      fg.group.add(wm);
    }
  }
  var gateCx = GATE_GAP/2 + GATE_W/2;
  var gateCz = -(OW + GATE_PROJ/2 - 1.0);
  buildGateTower(tG1, -gateCx, gateCz);
  buildGateTower(tG2,  gateCx, gateCz);
  registerPick(pickables, 'structure', 0, GATE_H/2, gateCz, 2*gateCx+GATE_W+1, GATE_H, GATE_PROJ*1.7,
    'ゲートハウス Gatehouse', '双塔式の主門。通路天井には殺人孔があり、かつて3基の木製ポートカリスが備わっていた。');
  // gate arch lintel spanning the passage, with a portcullis grid RAISED
  // up into the housing above the passage (was hanging low enough to
  // visually block the walk-through gap between the twin towers -- see
  // life.gates / section 6.5, residents now actually walk this passage).
  var lintel = mkBox(GATE_GAP+1.2, 1.4, GATE_PROJ*0.9, tG1.mat);
  place(lintel, 0, GATE_H*0.62, gateCz, 0);
  tG1.group.add(lintel);
  (function buildPortcullis(){
    var pg = new T.Group();
    var barW = 0.12, gh = GATE_H*0.5, gw = GATE_GAP*0.72;
    var RAISE = GATE_H - gh - 1.2; // tucks the grid up near the lintel/roof, clear of the passage below
    for (var i=-3;i<=3;i++){
      pg.add(place(mkBox(barW, gh, barW, metalMat), i*(gw/6), gh/2+0.3+RAISE, gateCz+GATE_PROJ*0.32));
    }
    for (var j=0;j<4;j++){
      pg.add(place(mkBox(gw, barW, barW, metalMat), 0, 0.6+j*(gh/3.2)+RAISE, gateCz+GATE_PROJ*0.32));
    }
    tG1.group.add(pg);
  })();
  // gate doors, modelled OPEN: two leaves swung flat against each tower's
  // inner reveal (instead of one closed panel spanning the whole gap) so
  // the passage between the twin towers reads as a real walk-through
  // opening, matching the already-open GATE_GAP in wallN (section 1).
  (function buildOpenGateDoors(){
    var leafH = GATE_H*0.42, leafLen = GATE_GAP*0.46, leafY = GATE_H*0.21;
    var leafZ = gateCz + GATE_PROJ*0.44;
    [-1,1].forEach(function(side){
      var leaf = mkBox(0.14, leafH, leafLen, woodMat);
      place(leaf, side*(GATE_GAP/2-0.07), leafY, leafZ - leafLen/2, 0);
      interiorGroup.add(leaf);
    });
  })();

  /* -------------------------------------------------------------- *
   * courtyard lawn (centre only) + wing stone floors (one step up) +
   * wing roofs
   * -------------------------------------------------------------- *
   * Bodiam's four ranges each occupy a ROOM_DEPTH-deep strip against the
   * inside of the curtain wall; only the residual central rectangle is
   * open lawn. The wing floors sit WING_FLOOR_Y above the lawn so the
   * "building footprint" reads clearly even before any walls are drawn. */
  var ROOM_DEPTH = 7.0;
  var COURT_HALF = INNER - ROOM_DEPTH;   // half-extent of the central lawn
  var WING_FLOOR_Y = 0.16;               // top surface of the wing stone floors

  var courtyard = mkBox(2*COURT_HALF, 0.32, 2*COURT_HALF, courtGrassMat);
  place(courtyard, 0, -0.16, 0);
  interiorGroup.add(courtyard);

  function wingFloor(x0,x1,z0,z1){
    var f = mkBox(x1-x0, 0.32, z1-z0, floorMat);
    place(f, (x0+x1)/2, WING_FLOOR_Y-0.16, (z0+z1)/2);
    interiorGroup.add(f);
  }
  wingFloor(-INNER, INNER, COURT_HALF, INNER);              // south wing floor
  wingFloor(-INNER, INNER, -INNER, -COURT_HALF);             // north wing floor
  wingFloor(COURT_HALF, INNER, -COURT_HALF, COURT_HALF);     // east wing floor
  wingFloor(-INNER, -COURT_HALF, -COURT_HALF, COURT_HALF);   // west wing floor

  function leanToRoof(mat, spanAxis, spanA, spanB, outerCoord, innerCoord, outerY, innerY){
    var run = outerCoord - innerCoord;
    var rise = outerY - innerY;
    var slant = Math.hypot(run, rise);
    var angle = Math.atan2(rise, Math.abs(run));
    var spanLen = Math.abs(spanB - spanA) + 1.4;
    var th = 0.45;
    var geo = spanAxis === 'x'
      ? new T.BoxGeometry(spanLen, th, slant)
      : new T.BoxGeometry(slant, th, spanLen);
    var mesh = new T.Mesh(geo, mat);
    var midOI = (outerCoord+innerCoord)/2, midY = (outerY+innerY)/2, midSpan = (spanA+spanB)/2;
    if (spanAxis === 'x'){
      mesh.position.set(midSpan, midY, midOI);
      mesh.rotation.x = (run > 0 ? -angle : angle);
    } else {
      mesh.position.set(midOI, midY, midSpan);
      mesh.rotation.z = (run > 0 ? angle : -angle);
    }
    mesh.castShadow = true; mesh.receiveShadow = true;
    return mesh;
  }

  var eaveH = WH - 0.35, ridgeInH = WH - 3.1;
  var INNER_N = -INNER, RIDGE_N = -(INNER-ROOM_DEPTH); // north-side coords are negative Z
  var INNER_W = -INNER, RIDGE_W = -(INNER-ROOM_DEPTH); // west-side coords are negative X
  // South wing roof (Great Hall / pantry / kitchen) -- outer edge at +Z (wall), inner at smaller +Z
  roofS.group.add(leanToRoof(roofS.mat, 'x', -10.6, 10.6, INNER, INNER-ROOM_DEPTH, eaveH, ridgeInH));
  // East wing roof (chapel / lord's apartments) -- outer edge at +X (wall), inner at smaller +X
  roofE.group.add(leanToRoof(roofE.mat, 'z', -10.6, 10.6, INNER, INNER-ROOM_DEPTH, eaveH, ridgeInH));
  // West wing roof (retainers' hall) -- outer edge at -X (wall), inner toward courtyard
  roofW.group.add(leanToRoof(roofW.mat, 'z', -10.6, 10.6, INNER_W, RIDGE_W, eaveH, ridgeInH));
  // North wing roof (stores / stable, either side of the gate passage) -- outer edge at -Z
  roofN.group.add(leanToRoof(roofN.mat, 'x', -10.6, -halfGate+0.4, INNER_N, RIDGE_N, eaveH, ridgeInH));
  roofN.group.add(leanToRoof(roofN.mat, 'x', halfGate-0.4, 10.6, INNER_N, RIDGE_N, eaveH, ridgeInH));

  /* -------------------------------------------------------------- *
   * chimneys (Great Hall, kitchen, lord's chambers, NW tower)
   * -------------------------------------------------------------- */
  function chimney(x,z,h,parentGroup,mat){
    var c = mkBox(0.9,h,0.9, mat||tileMat);
    place(c, x, h/2, z);
    (parentGroup||interiorGroup).add(c);
    var cap = mkBox(1.2,0.3,1.2, mat||tileMat);
    place(cap, x, h+0.15, z);
    (parentGroup||interiorGroup).add(cap);
  }
  chimney(6.4, INNER-1.5, WH+2.6, roofS.group, roofS.mat);   // great hall
  chimney(-9.0, INNER-1.2, WH+2.4, roofS.group, roofS.mat);  // kitchen
  chimney(INNER-1.4, 8.0, WH+2.4, roofE.group, roofE.mat);   // lord's apartments
  chimney(-OW+2.6, -OW+2.6, CORNER_H+2.6, tNW.group, tNW.mat); // NW tower

  /* -------------------------------------------------------------- *
   * interior partition walls (ruin-height stubs marking room-to-room
   * boundaries), low facade stubs along the courtyard-facing side of
   * each wing, end-cap walls near the corner towers, + furniture
   * (boxes / cylinders) + labels. All sit on top of the wing stone
   * floor (WING_FLOOR_Y above the lawn).
   * -------------------------------------------------------------- */
  var PARTITION_H = 3.0;  // room-to-room dividers
  var FACADE_H    = 1.15; // low corridor-facing wall along the courtyard edge
  function partitionWall(x,z,len,ry,h){
    h = h || PARTITION_H;
    var m = mkBox(len, h, 0.45, partitionMat);
    place(m, x, WING_FLOOR_Y + h/2, z, ry);
    interiorGroup.add(m);
    return m;
  }
  function facadeStub(cx,cz,len,ry){
    var m = mkBox(len, FACADE_H, 0.4, stubMat);
    place(m, cx, WING_FLOOR_Y + FACADE_H/2, cz, ry);
    interiorGroup.add(m);
    return m;
  }
  // kept for readability at call sites below (alias of partitionWall)
  function stub(x,z,len,ry){ return partitionWall(x,z,len,ry); }
  function furnitureBox(x,y,z,w,h,d,mat,ry){
    var m = mkBox(w,h,d,mat);
    place(m, x, WING_FLOOR_Y + y + h/2, z, ry||0);
    interiorGroup.add(m);
    return m;
  }
  // room hover/tap tooltip volumes -- an invisible box spanning the room's
  // floor footprint + a generous height, registered into `pickables` (see
  // registerPick in section 0). Replaces the old always-on sprite label.
  function pickRoom(x0,x1,z0,z1,h,name,desc){
    registerPick(pickables, 'room', (x0+x1)/2, WING_FLOOR_Y+h/2, (z0+z1)/2, Math.abs(x1-x0), h, Math.abs(z1-z0), name, desc);
  }

  // ---- South wing: Great Hall (east), screens passage, kitchen (west)
  var hallX0=-0.4, hallX1=10.4, wingZ0=INNER-ROOM_DEPTH, wingZ1=INNER;
  facadeStub(0, COURT_HALF, 2*INNER, 0);                        // courtyard-facing corridor line
  partitionWall(-INNER+0.3, (wingZ0+wingZ1)/2, ROOM_DEPTH, Math.PI/2); // west end-cap (near SW tower)
  partitionWall( INNER-0.3, (wingZ0+wingZ1)/2, ROOM_DEPTH, Math.PI/2); // east end-cap (near SE tower)
  stub(-2.0, (wingZ0+wingZ1)/2, ROOM_DEPTH, Math.PI/2); // divides hall / passage
  stub(-3.6, (wingZ0+wingZ1)/2, ROOM_DEPTH, Math.PI/2); // divides passage / kitchen
  var dais = furnitureBox(8.6, 0, (wingZ0+wingZ1)/2, 3.0, 0.4, 5.4, woodMat);
  furnitureBox(3.4, 0, (wingZ0+wingZ1)/2-0.6, 4.4, 0.7, 1.0, woodMat);
  furnitureBox(0.6, 0, (wingZ0+wingZ1)/2+0.6, 3.4, 0.7, 0.9, woodMat);
  var hearthHall = furnitureBox(8.2, 0, wingZ1-0.35, 2.2, 1.1, 0.5, new T.MeshLambertMaterial({color:0x2a1c14}));
  var hearthGlow = new T.PointLight(0xff7a33, 1.1, 6, 2);
  hearthGlow.position.set(8.2, WING_FLOOR_Y+1.0, wingZ1-0.7);
  interiorGroup.add(hearthGlow);
  pickRoom(-2.0, INNER-0.3, wingZ0, wingZ1, 6.0, '大広間 Great Hall',
    '領主一家が食事した、幅7m・奥行12mの2階分吹き抜けの広間。東端に領主の台座(ディス)があった。');
  pickRoom(-3.6, -2.0, wingZ0, wingZ1, 4.0, 'スクリーンズパッセージ Screens Passage',
    '大広間と厨房を仕切る配膳通路。奥にパントリーとバトリーが続く。');
  furnitureBox(-7.4, 0, wingZ0+0.9, 2.6, 1.1, 0.5, new T.MeshLambertMaterial({color:0x2a1c14}));
  furnitureBox(-7.4, 0, wingZ1-0.9, 2.6, 1.1, 0.5, new T.MeshLambertMaterial({color:0x2a1c14}));
  furnitureBox(-8.0, 0, (wingZ0+wingZ1)/2, 3.2, 0.75, 1.2, woodMat);
  pickRoom(-INNER+0.3, -3.6, wingZ0, wingZ1, 4.0, '厨房 Kitchen',
    '南棟西端。南北両壁に大きな炉を備えた調理場。');

  // ---- East wing: chapel (north), lord's/lady's apartments (south)
  var eWingX0=INNER-ROOM_DEPTH, eWingX1=INNER, eZ0=-10.4, eZ1=10.4;
  facadeStub(COURT_HALF, 0, 2*INNER, Math.PI/2);                        // courtyard-facing corridor line
  partitionWall((eWingX0+eWingX1)/2, -INNER+0.3, ROOM_DEPTH, 0);         // north end-cap (near NE tower)
  partitionWall((eWingX0+eWingX1)/2,  INNER-0.3, ROOM_DEPTH, 0);         // south end-cap (near SE tower)
  stub((eWingX0+eWingX1)/2, -0.6, ROOM_DEPTH, 0);
  // chapel floor: two-colour Flemish-tile checker (canvas texture, repeat-tiled)
  var chapelCheckerTex = makeCheckerTexture('#8f5a3c', '#ddd0a8', 6);
  var chapelFloorMat = new T.MeshLambertMaterial({ map: chapelCheckerTex });
  var chapelFloor = mkBox(ROOM_DEPTH-0.6, 0.08, 9.0, chapelFloorMat);
  place(chapelFloor, (eWingX0+eWingX1)/2, WING_FLOOR_Y+0.04, -5.0);
  interiorGroup.add(chapelFloor);
  furnitureBox(eWingX1-0.8, 0, -8.6, 0.9, 1.1, 1.6, new T.MeshLambertMaterial({color:0xd8d0b8}));
  furnitureBox(eWingX0+1.3, 0, -6.0, 2.2, 0.6, 0.7, woodMat);
  furnitureBox(eWingX0+1.3, 0, -4.0, 2.2, 0.6, 0.7, woodMat);
  furnitureBox(eWingX0+1.3, 0, -2.0, 2.2, 0.6, 0.7, woodMat);
  pickRoom(eWingX0, eWingX1, -INNER+0.3, -0.6, 4.5, '礼拝堂 Chapel',
    '東棟北寄り。フランドル風タイルの床。堀側の東壁はここで張り出している。');
  furnitureBox(eWingX0+1.8, 0, 4.0, 2.6, 0.7, 3.6, woodMat);
  furnitureBox(eWingX1-0.7, 0, 8.6, 2.0, 1.1, 0.5, new T.MeshLambertMaterial({color:0x2a1c14}));
  furnitureBox(eWingX0+0.9, 0, 8.4, 1.0, 0.8, 0.6, new T.MeshLambertMaterial({color:0x3a2a1a}));
  pickRoom(eWingX0, eWingX1, -0.6, INNER-0.3, 4.5, "領主居室 Lord's / Lady's Apartments",
    '東棟南寄り。東向きの窓と各階の暖炉を備えた領主一家の私室。');

  // ---- West wing: retainers' hall (blind outer wall, no hearth)
  var wWingX0=-INNER, wWingX1=-(INNER-ROOM_DEPTH), wZ0=-10.4, wZ1=10.4;
  facadeStub(-COURT_HALF, 0, 2*INNER, Math.PI/2);                       // courtyard-facing corridor line
  partitionWall((wWingX0+wWingX1)/2, -INNER+0.3, ROOM_DEPTH, 0);        // north end-cap (near NW tower)
  partitionWall((wWingX0+wWingX1)/2,  INNER-0.3, ROOM_DEPTH, 0);        // south end-cap (near SW tower)
  partitionWall((wWingX0+wWingX1)/2, 6.3, ROOM_DEPTH, 0);               // divides hall / servants' kitchen
  furnitureBox((wWingX0+wWingX1)/2, 0, -5.0, 5.0, 0.7, 1.0, woodMat);
  furnitureBox((wWingX0+wWingX1)/2, 0, 0.0, 5.0, 0.7, 1.0, woodMat);
  furnitureBox((wWingX0+wWingX1)/2, 0, 5.0, 5.0, 0.7, 1.0, woodMat);
  pickRoom(wWingX0, wWingX1, -INNER+0.3, 6.3, 4.0, "従者ホール Retainers' Hall",
    '西棟。外壁側には窓も暖炉もない、使用人たちの広間。');
  furnitureBox(wWingX1-1.0, 0, 8.0, 1.6, 0.9, 1.6, woodMat); // small servants' kitchen corner
  pickRoom(wWingX0, wWingX1, 6.3, INNER-0.3, 3.5, "従者厨房 Servants' Kitchen",
    '従者ホール南端の小さな調理場。');

  // ---- North wing: stores (east of gate) & stable (west of gate)
  var nWingZ0=-INNER, nWingZ1=-(INNER-ROOM_DEPTH);
  facadeStub(0, -COURT_HALF, 2*INNER, 0);                               // courtyard-facing corridor line
  partitionWall(-INNER+0.3, (nWingZ0+nWingZ1)/2, ROOM_DEPTH, Math.PI/2); // west end-cap (near NW tower)
  partitionWall( INNER-0.3, (nWingZ0+nWingZ1)/2, ROOM_DEPTH, Math.PI/2); // east end-cap (near NE tower)
  partitionWall(0, (nWingZ0+nWingZ1)/2, ROOM_DEPTH, Math.PI/2);          // divides stores / stable, centred on the gate passage
  for (var b=0;b<3;b++){
    furnitureBox(3.0+b*2.0, 0, (nWingZ0+nWingZ1)/2, 1.0, 1.2, 1.0, woodMat);
  }
  pickRoom(0, INNER-0.3, nWingZ0, nWingZ1, 3.5, '倉庫・宿舎 Stores',
    '北棟東側、ゲートハウスの東隣に位置する倉庫兼宿舎。');
  furnitureBox(-6.5, 0, (nWingZ0+nWingZ1)/2, 3.4, 0.5, 1.0, new T.MeshLambertMaterial({color:0x4a3a1e}));
  furnitureBox(-4.0, 0, (nWingZ0+nWingZ1)/2, 0.6, 0.9, 0.6, new T.MeshLambertMaterial({color:0xc8b878}));
  pickRoom(-INNER+0.3, 0, nWingZ0, nWingZ1, 3.5, '厩舎 Stable',
    '北棟西側、ゲートハウスの西隣に位置する厩舎。');

  // ---- Well, at the foot of the SW tower (on the south-wing stone floor
  // so it reads clearly, uncovered, in the top-down view). A flat paved
  // curb (dark stone) + a round water disc (blue) + a torus kerb ring
  // around the rim -- the torus leaves the water visible through its
  // centre, unlike a solid cylinder which would just hide it.
  var WELL_X = -(INNER-2.3), WELL_Z = (INNER-1.9);
  var wellMatDark = new T.MeshLambertMaterial({color:STONE_DARK});
  var wellPad = mkCyl(1.75,1.75,0.1,24, wellMatDark);
  place(wellPad, WELL_X, WING_FLOOR_Y+0.05, WELL_Z);
  interiorGroup.add(wellPad);
  var well = new T.Mesh(new T.CircleGeometry(1.15, 28), wellMat);
  well.rotation.x = -Math.PI/2;
  well.castShadow = false; well.receiveShadow = false;
  place(well, WELL_X, WING_FLOOR_Y+0.13, WELL_Z);
  interiorGroup.add(well);
  var wellKerb = new T.Mesh(new T.TorusGeometry(1.18, 0.16, 10, 28), wellMatDark);
  wellKerb.rotation.x = Math.PI/2;
  place(wellKerb, WELL_X, WING_FLOOR_Y+0.28, WELL_Z);
  interiorGroup.add(wellKerb);
  registerPick(pickables, 'room', WELL_X, WING_FLOOR_Y+1.0, WELL_Z, 3.4, 2.0, 3.4, '井戸 Well',
    '南西塔の地下に実在した井戸。館全体の生活用水をここから汲み上げた。');

  /* -------------------------------------------------------------- *
   * moat, graded bank, island, approaches
   * -------------------------------------------------------------- *
   * The moat/bank/island/ground assembly itself is castle-agnostic (see
   * buildWaterMoatSystem, section 0.5) -- only the numbers below are
   * Bodiam-specific. GROUND_Y is the outer field height; WATER_Y sits
   * ~1m below it (spec: 0.8-1.2m) so the graded banks read as a real
   * slope down into the moat rather than a flat plane dropped on top of
   * the grass. Bridge/octagon height relationships are untouched -- the
   * bridges still run from the *top* of the outer bank (still at
   * MOAT_OUTER, GROUND_Y) to the island, just as before; only the water
   * itself, and the ground it's cut into, moved. */
  var ISLAND_HALF = OW + 3.2;
  var MOAT_WIDTH = 27;
  var MOAT_OUTER = ISLAND_HALF + MOAT_WIDTH;
  var GROUND_Y = -0.55;
  var WATER_Y = GROUND_Y - 1.0; // 1.0m below the field -- within the 0.8-1.2m spec

  var moatSys = buildWaterMoatSystem({
    group: group,
    groundY: GROUND_Y, waterY: WATER_Y,
    islandHalf: ISLAND_HALF, islandY: 0.02,
    moatOuterHalf: MOAT_OUTER,
    bankWidthOut: 4.2, bankWidthIn: 3.0,
    groundMat: grassMat, islandMat: grassMat2,
    waterColor: WATER_COL,
    bankColorTop: BANK_COL, bankColorMid: BANK_MID_COL, bankColorEdge: BANK_EDGE_COL
  });
  var waterMat = moatSys.waterMat;

  // north approach: bank -> timber bridge -> octagon island -> drawbridge -> gatehouse
  var octR = 3.3, octZ = -(ISLAND_HALF + MOAT_WIDTH*0.42);
  var oct = new T.Mesh(new T.CircleGeometry(octR, 8), bankMat);
  oct.rotation.x = -Math.PI/2; oct.rotation.y = Math.PI/8;
  place(oct, 0, 0.02, octZ);
  group.add(oct);
  // the octagon platform also meets the water on a slope, not a hard disc
  // edge, using the same vertex-coloured ramp technique as the main banks
  var octSkirt = buildCircularSkirt(0, octZ, octR, octR+1.8, 0.02, WATER_Y,
    new T.Color(BANK_COL), new T.Color(BANK_MID_COL), new T.Color(BANK_EDGE_COL));
  group.add(octSkirt);

  var b1z0 = -MOAT_OUTER+1.0, b1z1 = octZ-octR;
  var bridge1 = mkBox(2.6, 0.35, Math.abs(b1z1-b1z0), woodMat);
  place(bridge1, 0, -0.05, (b1z0+b1z1)/2);
  group.add(bridge1);
  var b2z0 = octZ+octR, b2z1 = -(OW+GATE_PROJ-0.6);
  var bridge2 = mkBox(3.4, 0.3, Math.abs(b2z1-b2z0), woodMat);
  place(bridge2, 0, -0.02, (b2z0+b2z1)/2);
  group.add(bridge2);

  // south approach: straight bridge from bank to postern tower
  var s0 = MOAT_OUTER-1.0, s1 = OW+MID_PROJ-0.4;
  var bridgeS = mkBox(3.0, 0.3, Math.abs(s0-s1), woodMat);
  place(bridgeS, 0, -0.02, (s0+s1)/2);
  group.add(bridgeS);

  // bridge piers: the water is now well below deck height (~1.5m), so
  // give the two long open-water spans a couple of timber support posts
  // reaching down to just below the waterline -- purely cosmetic, no
  // collision/height logic depends on them.
  function bridgePier(x, z, deckY){
    var pier = mkCyl(0.22, 0.26, (deckY - (WATER_Y - 0.4)), 8, woodMat);
    place(pier, x, (deckY + (WATER_Y - 0.4))/2, z);
    group.add(pier);
  }
  [0.35, 0.65].forEach(function(f){
    var z = b1z0 + (b1z1-b1z0)*f;
    bridgePier(-0.85, z, -0.05); bridgePier(0.85, z, -0.05);
  });
  (function(){
    var z = s0 + (s1-s0)*0.5;
    bridgePier(-0.9, z, -0.02); bridgePier(0.9, z, -0.02);
  })();

  /* -------------------------------------------------------------- *
   * info payload (room list metadata; not rendered as a standalone
   * legend panel -- room names now surface via the always-on label
   * toggle and the hover tooltip, both driven off `pickables` below)
   * -------------------------------------------------------------- */
  var info = {
    rooms: [
      { name:'大広間 (Great Hall)', desc:'南棟東側。2階分の吹き抜け、東端に領主の台座。' },
      { name:'スクリーンズパッセージ', desc:'大広間と厨房を隔てる通路、配膳室を兼ねる。' },
      { name:'厨房 (Kitchen)', desc:'南棟西端。南北両壁に大きな炉。' },
      { name:'礼拝堂 (Chapel)', desc:'東棟北寄り。フランドルタイルの床、2階に領主用オラトリー。' },
      { name:"領主居室 (Lord's/Lady's Apartments)", desc:'東棟南寄り。東向きの窓、各階に暖炉。' },
      { name:"従者ホール (Retainers' Hall)", desc:'西棟。外壁側は窓なし、暖炉なし。' },
      { name:'倉庫・宿舎', desc:'北棟東側、ゲートハウスの東隣。' },
      { name:'厩舎 (Stable)', desc:'北棟西側、ゲートハウスの西隣。' },
      { name:'井戸 (Well)', desc:'南西円塔のたもと、南棟の石床上。' }
    ]
  };

  // always-on labels (section 6 toggle): shared helper, see buildLabelGroup
  // (section 0) -- covers both structure and room pickables.
  var labelGroup = buildLabelGroup(group, pickables);

  /* ---- resident life data (section 6.5 住人システムが読む任意フィールド)
   * 門1つ(北の主門)+ 北の橋、狭い中庭は courtyard 矩形1枚、衛兵は中庭の縁
   * を地面レベルで周回(壁がフェードしても浮かないよう常にy=0)。
   * gate.path: 中庭側の門口(内側)から双塔間の通路を抜けた先(外側、橋2の
   * 起点あたり)までの中心線。toGate/through が必ずこの線分を経由してから
   * outside の消失フェードに入る(section 6.5 参照)。 -------------------- */
  var gateOuterZ = gateCz - GATE_PROJ/2 - 0.3; // 双塔ゲートハウスの北端 = 橋2の起点付近
  var gatePathLen = -OW - gateOuterZ; // 通路(内側口→外側口)の長さ
  var life = {
    gates: [ { path: [ {x:0, z:-OW}, {x:0, z:gateOuterZ} ], outDir:{x:0,z:-1},
      vanishDist: (MOAT_OUTER - OW + 6) - gatePathLen } ],
    courtyard: [ { minX:-COURT_HALF, maxX:COURT_HALF, minZ:-COURT_HALF, maxZ:COURT_HALF } ],
    patrol: [
      [ COURT_HALF-0.8, 0, -(COURT_HALF-0.8)], [ COURT_HALF-0.8, 0,  COURT_HALF-0.8],
      [-(COURT_HALF-0.8), 0,  COURT_HALF-0.8], [-(COURT_HALF-0.8), 0, -(COURT_HALF-0.8)]
    ],
    population: { farmers: 8, guards: 2 }
  };

  return { group: group, fadeGroups: fadeGroups, interiorGroup: interiorGroup, info: info,
    pickables: pickables, windowMat: windowMat, waterMats: [waterMat], labelGroup: labelGroup, life: life };
}

/* ====================================================================
 * 1.5 Chateau de Vincennes procedural builder
 * ====================================================================
 * Returns the same { group, fadeGroups, interiorGroup, info, pickables,
 * windowMat, waterMats, labelGroup } contract as buildBodiam(). At ~10x
 * Bodiam's footprint (330x175m rectangular enceinte vs. a 33m square),
 * this is a TWO-TIER cutaway: the outer enceinte (walls/towers, tier
 * 'outer', the same WALL_START/END + ROOF_START/END bands Bodiam uses)
 * fades first as the camera zooms in; the donjon's own shell (tier
 * 'inner', DONJON_WALL_START/END + DONJON_ROOF_START/END -- see section
 * 5) only fades once the camera is close enough that the outer shell has
 * already faded away, revealing the keep's five floors.
 *
 * Layout follows the real enceinte's official plan (long axis is
 * north-south, 330m; short axis is east-west, 175m): 3 towers each on
 * the short north/south walls (2 corners + a gate in the middle), 3
 * towers spaced along the long east wall, and NO towers on the west wall
 * -- the donjon + its chemise instead bite into and bulge out past the
 * west wall there, exactly as the plan shows.
 */
function buildVincennes(){
  var group = new T.Group();
  var interiorGroup = new T.Group();
  group.add(interiorGroup);
  var fadeGroups = [];
  var pickables = [];

  function makeFadeGroup(name, dir, isRoof, colorHex, tier){
    var mat = new T.MeshLambertMaterial({ color: colorHex });
    var g = new T.Group();
    g.name = name;
    group.add(g);
    var desc = { group:g, mat:mat, dir:dir, roof: !!isRoof, op:1, name:name, tier: tier || 'outer' };
    fadeGroups.push(desc);
    return desc;
  }

  /* ---- palette: pale Paris limestone, slate roofs ------------------ */
  var STONE_WALL   = 0xb9b2a0;
  var STONE_WALL_V = 0xafa896;
  var STONE_DARK   = 0x8a8474;
  var ROOF_COL     = 0x3f3c38; // dark slate -- used for roofs, chemise walkway cap, bartizan caps
  var WINDOW_COL   = 0x1c150e;
  var FLOOR_COL    = 0x9c9484;
  var STUB_COL     = 0x776f5e;
  var WOOD_COL     = 0x6b4f34;
  var METAL_COL    = 0x2a2925;
  var WATER_COL    = 0x35545c;
  var GRASS_COL    = 0x5c7a48;
  var GRASS_COL2   = 0x6c8a52;
  var BANK_COL     = 0x8a7a58;
  var BANK_MID_COL = 0x62543a;
  var BANK_EDGE_COL= 0x2f2617;
  var COURT_GRASS_COL = 0x6a8d4f;

  var windowMat = new T.MeshLambertMaterial({ color: WINDOW_COL });
  var floorMat  = new T.MeshLambertMaterial({ color: FLOOR_COL });
  var stubMat   = new T.MeshLambertMaterial({ color: STUB_COL, side: T.DoubleSide });
  var woodMat   = new T.MeshLambertMaterial({ color: WOOD_COL });
  var metalMat  = new T.MeshLambertMaterial({ color: METAL_COL });
  var grassMat  = new T.MeshLambertMaterial({ color: GRASS_COL });
  var grassMat2 = new T.MeshLambertMaterial({ color: GRASS_COL2 });
  var courtGrassMat = new T.MeshLambertMaterial({ color: COURT_GRASS_COL });
  var darkWoodMat = new T.MeshLambertMaterial({ color: 0x2a1c14 });
  var chemiseMat = new T.MeshLambertMaterial({ color: STONE_DARK });
  var slateMat = new T.MeshLambertMaterial({ color: ROOF_COL });

  /* -------------------------------------------------------------- *
   * outer enceinte: 175m (E-W, short) x 330m (N-S, long) rectangle,
   * 11m wall, 9 rectangular (not round) towers -- 3 each on the short
   * north/south walls (corner/gate/corner), 3 spaced along the long east
   * wall, none on the west wall (donjon bulge there instead). All at
   * their full 14th-century height (42m), per spec.
   * -------------------------------------------------------------- */
  var OHX = 87.5, OHZ = 165;          // outer wall half-extents (175 x 330m)
  var WT = 2.8, WH = 11, MER = 1.5;   // wall thickness / height / merlon height
  var TOWER_W = 9, TOWER_D = 7, TOWER_H = 42, TOWER_ROOF_H = 6.5;
  var GATE_W = 12, GATE_D = 9, GATE_ROOF_H = 7.5;     // Tour du Village (main gate), larger
  var GATE2_W = 10, GATE2_D = 8, GATE2_ROOF_H = 7;    // Tour du Bois (second gate)

  function addCrenellations(target, mat, cx, cz, length, ry, topY, thickness){
    var merlonW = 1.5, gapW = 1.35, mt = thickness*0.72;
    var period = merlonW + gapW;
    var count = Math.max(1, Math.floor(length/period));
    var start = -(count*period)/2 + merlonW/2;
    var co = Math.cos(ry), si = Math.sin(ry);
    for (var i=0;i<count;i++){
      var lx = start + i*period;
      var wx = cx + lx*co, wz = cz - lx*si;
      var m = mkBox(merlonW, MER, mt, mat);
      place(m, wx, topY + MER/2, wz, ry);
      target.add(m);
    }
  }
  function buildStraightWall(fg, cx, cz, length, ry, windows){
    var wall = mkBox(length, WH, WT, fg.mat);
    place(wall, cx, WH/2, cz, ry);
    fg.group.add(wall);
    addCrenellations(fg.group, fg.mat, cx, cz, length, ry, WH, WT);
    if (windows){
      var co=Math.cos(ry), si=Math.sin(ry);
      windows.forEach(function(w){
        var win = mkBox(w.w, w.h, WT*1.05, windowMat);
        place(win, cx+w.x*co, WH*0.6, cz-w.x*si, ry);
        fg.group.add(win);
      });
    }
  }

  var wallN = makeFadeGroup('wallN', {x:0,z:-1}, false, STONE_WALL);
  var wallS = makeFadeGroup('wallS', {x:0,z:1},  false, STONE_WALL);
  var wallE = makeFadeGroup('wallE', {x:1,z:0},  false, STONE_WALL);
  var wallW1 = makeFadeGroup('wallW1', {x:-1,z:0}, false, STONE_WALL); // west, north of the donjon gap
  var wallW2 = makeFadeGroup('wallW2', {x:-1,z:0}, false, STONE_WALL); // west, south of the donjon gap
  var tParis = makeFadeGroup('towerParis', {x:0,z:-1}, false, STONE_WALL_V);
  var tVillage = makeFadeGroup('gateVillage', {x:0,z:-1}, false, STONE_WALL_V);
  var tReservoir = makeFadeGroup('towerReservoir', {x:0,z:-1}, false, STONE_WALL_V);
  var tDiable = makeFadeGroup('towerDiable', {x:1,z:0}, false, STONE_WALL_V);
  var tSalves = makeFadeGroup('towerSalves', {x:1,z:0}, false, STONE_WALL_V);
  var tSurintendance = makeFadeGroup('towerSurintendance', {x:1,z:0}, false, STONE_WALL_V);
  var tRoi = makeFadeGroup('towerRoi', {x:0,z:1}, false, STONE_WALL_V);
  var tBois = makeFadeGroup('gateBois', {x:0,z:1}, false, STONE_WALL_V);
  var tReine = makeFadeGroup('towerReine', {x:0,z:1}, false, STONE_WALL_V);
  var roofCaps = makeFadeGroup('roofCaps', null, true, ROOF_COL); // outer-tier tower roofs

  // west wall gap (donjon + chemise bulge through here -- see section below)
  var W_GAP0 = 10, W_GAP1 = 90;
  // north/south walls: split either side of the gate tower's own footprint
  // (GATE_W / GATE2_W) rather than one continuous box -- the gate tower
  // below now carves a real through-opening (see buildTower's opts.gate
  // branch), and a solid wall panel spanning behind it would still block
  // that opening even though the tower in front of it is pierced.
  function splitWallForGate(fg, cz, ry, gateSpanW, winL, winR){
    var half = gateSpanW/2, segLen = OHX - half, segCx = half + segLen/2;
    buildStraightWall(fg, -segCx, cz, segLen, ry, winL);
    buildStraightWall(fg,  segCx, cz, segLen, ry, winR);
  }
  splitWallForGate(wallN, -OHZ, 0, GATE_W, [{x:-20,w:1.6,h:2.6}], [{x:20,w:1.6,h:2.6}]);
  splitWallForGate(wallS, OHZ, Math.PI, GATE2_W, [{x:-20,w:1.6,h:2.6}], [{x:20,w:1.6,h:2.6}]);
  buildStraightWall(wallE, OHX, 0, 2*OHZ, -Math.PI/2, [
    {x:-140,w:1.6,h:2.6},{x:-100,w:1.6,h:2.6},{x:-30,w:1.6,h:2.6},{x:30,w:1.6,h:2.6},
    {x:60,w:1.6,h:2.6},{x:130,w:1.6,h:2.6}
  ]);
  buildStraightWall(wallW1, -OHX, (-OHZ+W_GAP0)/2, W_GAP0-(-OHZ), Math.PI/2, [{x:-40,w:1.6,h:2.6}]);
  buildStraightWall(wallW2, -OHX, (W_GAP1+OHZ)/2, OHZ-W_GAP1, Math.PI/2, []);

  registerPick(pickables, 'structure', 0, WH/2, -OHZ, OHX*0.7, WH, WT*2, '北城壁 North Curtain Wall', '高さ11mの外郭城壁。石造の水堀がこれを囲む。');
  registerPick(pickables, 'structure', 0, WH/2, OHZ, OHX*0.7, WH, WT*2, '南城壁 South Curtain Wall', '高さ11mの外郭城壁。');
  registerPick(pickables, 'structure', OHX, WH/2, 0, WT*2, WH, OHZ*1.5, '東城壁 East Curtain Wall', '高さ11mの外郭城壁。1km超に及ぶ城壁の一部。');
  registerPick(pickables, 'structure', -OHX, WH/2, -OHZ*0.55, WT*2, WH, OHZ*0.75, '西城壁 West Curtain Wall', '高さ11mの外郭城壁。中央でドンジョンのシェミーズに途切れる。');

  /* rectangular towers (both plain and gate) -- all 42m, full medieval
   * height, proud of a continuous curtain wall. The two gate towers
   * (Tour du Village / Tour du Bois) now carve a REAL through-opening
   * (GATE_OPEN_W wide x GATE_OPEN_H tall, spanning the tower's full depth
   * `d`) instead of a door decal on solid stone: the body is split into
   * left/right pillars + a lintel over the gap, exactly the same split
   * technique buildStraightWall's gate-flanking segments use for the wall
   * behind it (see splitWallForGate above), so residents walk an actual
   * tunnel (life.gates path, section 6.5) rather than clipping through. */
  var GATE_OPEN_W = 4.0, GATE_OPEN_H = 5.0;
  function buildTower(fg, cx, cz, ry, opts){
    var w = opts.w, d = opts.d, h = TOWER_H, roofH = opts.roofH || TOWER_ROOF_H;
    var co = Math.cos(ry), si = Math.sin(ry);
    if (opts.gate){
      var openW = Math.min(GATE_OPEN_W, w-2.6), openH = GATE_OPEN_H;
      var pillarW = (w-openW)/2;
      [-1,1].forEach(function(side){
        var lx = side*(openW/2+pillarW/2);
        var pillar = mkBox(pillarW, h, d, fg.mat);
        place(pillar, cx+lx*co, h/2, cz-lx*si, ry);
        fg.group.add(pillar);
      });
      var openLintel = mkBox(openW, h-openH, d, fg.mat);
      place(openLintel, cx, openH+(h-openH)/2, cz, ry);
      fg.group.add(openLintel);
    } else {
      var body = mkBox(w, h, d, fg.mat);
      place(body, cx, h/2, cz, ry);
      fg.group.add(body);
    }
    var lip = mkBox(w*1.08, 0.7, d*1.1, fg.mat);
    place(lip, cx, h-0.6, cz, ry);
    fg.group.add(lip);
    addCrenellations(fg.group, fg.mat, cx, cz, w, ry, h, d);
    var roof = mkCone(Math.max(w,d)*0.62, roofH, 4, roofCaps.mat);
    roof.rotation.y = Math.PI/4;
    place(roof, cx, h+MER+roofH/2, cz);
    roofCaps.group.add(roof);
    if (!opts.gate){
      // arrow-loop windows -- skipped on gate towers: their front face is
      // now a real opening, a window column there would float in the void
      var storeys = Math.floor(h/5.4);
      for (var s=0;s<storeys;s++){
        var wm = mkBox(0.6,1.8,0.4, windowMat);
        place(wm, cx+fg.dir.x*(d/2-0.02), 3.4+s*5.4, cz+fg.dir.z*(d/2-0.02), ry);
        fg.group.add(wm);
      }
    }
    if (opts.gate){
      var openW2 = Math.min(GATE_OPEN_W, w-2.6), openH2 = GATE_OPEN_H;
      if (opts.isMain){
        // portcullis, RAISED into the housing above the opening (a small
        // peek below the lintel, mostly tucked into the solid stone above
        // so it reads as "raised", not blocking the passage below it)
        var pg = new T.Group();
        var pgMat = metalMat.clone(); // per-tower clone: both gate towers fade independently
        var gridH = 2.6, gridY = openH2 - 0.3 + gridH/2;
        for (var bi=-3;bi<=3;bi++) pg.add(place(mkBox(0.1,gridH,0.1, pgMat), cx+bi*(openW2/7)*co, gridY, cz-bi*(openW2/7)*si));
        for (var bj=0;bj<3;bj++) pg.add(place(mkBox(openW2*0.9,0.1,0.1, pgMat), cx, openH2-0.3+bj*(gridH/2.2), cz));
        fg.group.add(pg);
      }
      // open double doors, swung flat against the new opening's own
      // pillars (the reveals either side of the gap) instead of a single
      // closed leaf blocking it -- decorative, so kept in interiorGroup
      // like Bodiam's equivalent open gate doors (never fades).
      var leafLen = d*0.42, leafH = openH2*0.94;
      [-1,1].forEach(function(side){
        var lx = side*(openW2/2-0.08);
        var lz = d/2 - leafLen/2 - 0.15;
        var leaf = mkBox(0.16, leafH, leafLen, woodMat);
        place(leaf, cx+lx*co+fg.dir.x*lz, leafH/2+0.05, cz-lx*si+fg.dir.z*lz, ry);
        interiorGroup.add(leaf);
      });
    }
    registerPick(pickables, 'structure', cx, h*0.4, cz, w*1.7, h*0.8, d*1.7, opts.label, opts.desc);
  }

  buildTower(tParis, -OHX, -OHZ, 0, { w:TOWER_W, d:TOWER_D,
    label:'パリ塔 Tour de Paris', desc:'北西隅の塔。全高42mの中世当時の姿に復元。パリへ向かう方角にちなむ。' });
  buildTower(tVillage, 0, -OHZ, 0, { w:GATE_W, d:GATE_D, roofH:GATE_ROOF_H, gate:true, isMain:true,
    label:'村門塔 Tour du Village (主門)', desc:'城の正門。北壁中央にそびえる最大の塔で、城下と結ぶ最も重要な出入口。' });
  buildTower(tReservoir, OHX, -OHZ, 0, { w:TOWER_W, d:TOWER_D,
    label:'貯水塔 Tour du Réservoir', desc:'北東隅の塔。全高42mの中世当時の姿に復元。' });
  buildTower(tDiable, OHX, -70, -Math.PI/2, { w:TOWER_W, d:TOWER_D,
    label:'悪魔塔 Tour du Diable', desc:'東の長城壁沿いに立つ側防塔の一つ。' });
  buildTower(tSalves, OHX, 10, -Math.PI/2, { w:TOWER_W, d:TOWER_D,
    label:'砲撃塔 Tour des Salves', desc:'東の長城壁沿いに立つ側防塔。祝砲を放った塔と伝わる。' });
  buildTower(tSurintendance, OHX, 95, -Math.PI/2, { w:TOWER_W, d:TOWER_D,
    label:'財務総監塔 Tour de la Surintendance', desc:'東の長城壁沿いに立つ側防塔。財務総監の執務にちなむ。' });
  buildTower(tRoi, -OHX, OHZ, Math.PI, { w:TOWER_W, d:TOWER_D,
    label:'王塔 Tour du Roi', desc:'南西隅の塔。全高42mの中世当時の姿に復元。' });
  buildTower(tBois, 0, OHZ, Math.PI, { w:GATE2_W, d:GATE2_D, roofH:GATE2_ROOF_H, gate:true, isMain:false,
    label:'木の門塔 Tour du Bois (第二門)', desc:'南壁中央の第二の門。ヴァンセンヌの森側への出入口。' });
  buildTower(tReine, OHX, OHZ, Math.PI, { w:TOWER_W, d:TOWER_D,
    label:'王妃塔 Tour de la Reine', desc:'南東隅の塔。全高42mの中世当時の姿に復元。' });

  /* -------------------------------------------------------------- *
   * donjon (keep): 16.5m square, 52m tall, four full-height corner
   * turrets (7.2m diameter -- thickened for visual presence against the
   * 16.5m body), a north stair tower, projecting machicolation-style
   * cornices near the top (body + turrets) and a flat dark roof cap.
   * Enclosed by a 13m chemise wall (raised from the previous 5m) with a
   * slate-capped wall-walk, corner bartizans, a decorative gate facing
   * the bailey, and its own moat (reusing buildWaterMoatSystem -- square
   * footprint fits the shared helper directly) with two drawbridges. The
   * whole complex bites into and bulges out past the west curtain wall,
   * matching the official plan. Two-tier cutaway: donjon shell fades
   * only once the outer enceinte has already faded away (tier 'inner').
   * -------------------------------------------------------------- */
  var DCX = -95, DCZ = 50;              // donjon complex centre (bulging past the west wall)
  var DHALF = 8.25, DH = 52;            // 16.5m square footprint, 52m tall
  var TURR_R = 3.6;                     // corner turret radius (7.2m diameter), full height
  var STAIR_R = 3.0;                    // north stair-tower radius

  var dWallN = makeFadeGroup('donjonWallN', {x:0,z:-1}, false, STONE_WALL_V, 'inner');
  var dWallS = makeFadeGroup('donjonWallS', {x:0,z:1},  false, STONE_WALL_V, 'inner');
  var dWallE = makeFadeGroup('donjonWallE', {x:1,z:0},  false, STONE_WALL_V, 'inner');
  var dWallW = makeFadeGroup('donjonWallW', {x:-1,z:0}, false, STONE_WALL_V, 'inner');
  var dTurrets = makeFadeGroup('donjonTurrets', null, true, STONE_WALL_V, 'inner');
  var dStair = makeFadeGroup('donjonStair', {x:0,z:-1}, false, STONE_WALL_V, 'inner');
  var dRoof = makeFadeGroup('donjonRoof', null, true, ROOF_COL, 'inner');

  function donjonWallFace(fg, cx, cz, ry){
    var w = mkBox(DHALF*2, DH, 0.9, fg.mat);
    place(w, cx, DH/2, cz, ry);
    fg.group.add(w);
    // machicolation-style projecting cornice near the top
    var lip = mkBox(DHALF*2+0.8, 0.8, 1.3, fg.mat);
    place(lip, cx, DH-1.0, cz, ry);
    fg.group.add(lip);
    addCrenellations(fg.group, fg.mat, cx, cz, DHALF*2, ry, DH, 0.9);
  }
  donjonWallFace(dWallN, DCX, DCZ-DHALF, 0);
  donjonWallFace(dWallS, DCX, DCZ+DHALF, Math.PI);
  donjonWallFace(dWallE, DCX+DHALF, DCZ, -Math.PI/2);
  donjonWallFace(dWallW, DCX-DHALF, DCZ, Math.PI/2);

  function donjonWindows(fg, cx, cz, ry){
    var co=Math.cos(ry), si=Math.sin(ry);
    for (var lvl=0; lvl<4; lvl++){
      var y = 6 + lvl*10.4;
      var win = mkBox(0.55, 1.9, 0.35, windowMat); // single vertical column per face, centred
      place(win, cx, y, cz, ry);
      fg.group.add(win);
    }
  }
  donjonWindows(dWallN, DCX, DCZ-DHALF, 0);
  donjonWindows(dWallS, DCX, DCZ+DHALF, Math.PI);
  donjonWindows(dWallE, DCX+DHALF, DCZ, -Math.PI/2);
  donjonWindows(dWallW, DCX-DHALF, DCZ, Math.PI/2);

  var turretPos = [
    {x:DCX-DHALF, z:DCZ-DHALF}, {x:DCX+DHALF, z:DCZ-DHALF},
    {x:DCX+DHALF, z:DCZ+DHALF}, {x:DCX-DHALF, z:DCZ+DHALF}
  ];
  turretPos.forEach(function(p){
    var t = mkCyl(TURR_R, TURR_R*1.05, DH, 14, dTurrets.mat);
    place(t, p.x, DH/2, p.z);
    dTurrets.group.add(t);
    var tlip = mkCyl(TURR_R*1.22, TURR_R*1.3, 0.9, 14, dTurrets.mat);
    place(tlip, p.x, DH-1.0, p.z);
    dTurrets.group.add(tlip);
    var cap = mkCyl(TURR_R*1.1, TURR_R*1.1, 1.6, 14, dRoof.mat); // flat dark cap, not conical
    place(cap, p.x, DH+0.8, p.z);
    dRoof.group.add(cap);
  });

  var stairCz = DCZ - DHALF - STAIR_R*0.7;
  var stairShaft = mkCyl(STAIR_R, STAIR_R*1.05, DH-4, 14, dStair.mat);
  place(stairShaft, DCX, (DH-4)/2, stairCz);
  dStair.group.add(stairShaft);
  var stairCap = mkCyl(STAIR_R*1.05, STAIR_R*1.05, 1.4, 14, dRoof.mat);
  place(stairCap, DCX, DH-3.3, stairCz);
  dRoof.group.add(stairCap);
  registerPick(pickables, 'structure', DCX, DH*0.4, stairCz, STAIR_R*2.4, DH*0.7, STAIR_R*2.4,
    '螺旋階段塔 Spiral Staircase Tower', 'ドンジョン北面に付属する塔。各階を結ぶ螺旋階段を収める。');

  // flat dark roof cap spanning the whole body (between the 4 turret caps)
  var donjonRoofMesh = mkBox(DHALF*2-0.4, 1.6, DHALF*2-0.4, dRoof.mat);
  place(donjonRoofMesh, DCX, DH+0.8, DCZ);
  dRoof.group.add(donjonRoofMesh);

  registerPick(pickables, 'structure', DCX, DH*0.4, DCZ, DHALF*2+TURR_R*2, DH*0.75, DHALF*2+TURR_R*2,
    'ドンジョン Donjon (大塔)', '高さ52m、一辺16.5mの主塔。四隅の太い円形小塔とマシクレーション風の張り出しを持つ、当時ヨーロッパ最大級の居住塔。');

  /* ---- five floors: basement + 3 lower floors (decorative central
   * pillar) + upper guard/armoury levels. All furniture sits in
   * interiorGroup, hidden behind the still-opaque donjon shell until the
   * inner-tier cutaway fades it. ---------------------------------- */
  var donjonFloors = [
    { y0:-4, y1:0,     name:'地下貯蔵庫 Basement Storage', pillar:true,
      desc:'石造ヴォールト天井の貯蔵庫。食料や物資を保管した。' },
    { y0:0, y1:10.4,   name:'評議の間 Chamber of Council (1F)', pillar:true,
      desc:'国王が重臣と政務を協議した、玄関階(テラスレベル)の広間。' },
    { y0:10.4, y1:20.8, name:"王の寝室 King's Bedchamber (2F)", pillar:true, fireplace:true,
      desc:'シャルル5世の私室。中央柱と暖炉を備えた、大塔で最も格式高い部屋。' },
    { y0:20.8, y1:31.2, name:'賓客の間 Guest Chamber (3F)', pillar:true,
      desc:'来賓を迎えた部屋。下層4フロア共通の装飾中央柱で天井を支える。' },
    { y0:31.2, y1:52,   name:'兵士詰所・弾薬庫 Guard Room & Armoury (Upper)', pillar:false,
      desc:'上層階は守備兵の詰所と武具・弾薬の保管に充てられた。' }
  ];
  donjonFloors.forEach(function(f){
    var slab = mkBox(DHALF*2-0.6, 0.3, DHALF*2-0.6, floorMat);
    place(slab, DCX, f.y0+0.15, DCZ);
    interiorGroup.add(slab);
    if (f.pillar){
      var pillar = mkCyl(0.6, 0.7, f.y1-f.y0-0.3, 10, stubMat);
      place(pillar, DCX, (f.y0+f.y1)/2, DCZ);
      interiorGroup.add(pillar);
    }
    if (f.fireplace){
      var hearth = mkBox(2.4, 1.3, 0.6, darkWoodMat);
      place(hearth, DCX+DHALF-1.5, f.y0+0.9, DCZ);
      interiorGroup.add(hearth);
    }
    var fbox = mkBox(1.6, 0.8, 1.0, woodMat);
    place(fbox, DCX-2.4, f.y0+0.55, DCZ+2.4);
    interiorGroup.add(fbox);
    registerPick(pickables, 'room', DCX, (f.y0+f.y1)/2, DCZ, DHALF*2-0.8, f.y1-f.y0-0.4, DHALF*2-0.8, f.name, f.desc);
  });

  /* ---- chemise (13m outer skirt wall around the donjon, raised from
   * the previous 5m stub): a slate-capped wall-walk, four corner
   * bartizans with conical slate roofs, a decorative gate on the
   * bailey-facing (east) side, its own moat via the shared square-moat
   * helper, and two drawbridges. ------------------------------------ */
  var CHEM_HALF = 24, CHEM_H = 13;
  function chemiseSide(cx,cz,length,ry){
    var w = mkBox(length, CHEM_H, 1.4, chemiseMat);
    place(w, cx, CHEM_H/2, cz, ry);
    group.add(w);
    // dark slate wall-walk cap (a covered parapet cover, simplified from a
    // true single-pitch shed roof -- reads the same at this scale)
    var cap = mkBox(length+1.0, 0.6, 2.0, slateMat);
    place(cap, cx, CHEM_H+0.3, cz, ry);
    group.add(cap);
  }
  chemiseSide(DCX, DCZ-CHEM_HALF, CHEM_HALF*2, 0);
  chemiseSide(DCX, DCZ+CHEM_HALF, CHEM_HALF*2, Math.PI);
  chemiseSide(DCX+CHEM_HALF, DCZ, CHEM_HALF*2, -Math.PI/2);
  chemiseSide(DCX-CHEM_HALF, DCZ, CHEM_HALF*2, Math.PI/2);

  var bartPos = [
    {x:DCX-CHEM_HALF, z:DCZ-CHEM_HALF}, {x:DCX+CHEM_HALF, z:DCZ-CHEM_HALF},
    {x:DCX+CHEM_HALF, z:DCZ+CHEM_HALF}, {x:DCX-CHEM_HALF, z:DCZ+CHEM_HALF}
  ];
  bartPos.forEach(function(p){
    var bt = mkCyl(1.6, 1.7, 3.0, 12, chemiseMat);
    place(bt, p.x, CHEM_H+1.5, p.z);
    group.add(bt);
    var cap = mkCone(1.9, 2.0, 12, slateMat);
    place(cap, p.x, CHEM_H+3.0+1.0, p.z);
    group.add(cap);
  });

  // decorative gate on the bailey-facing (east) side
  var chemGate = mkBox(3.4, CHEM_H*0.55, 0.35, windowMat);
  place(chemGate, DCX+CHEM_HALF-0.05, CHEM_H*0.28, DCZ, -Math.PI/2);
  group.add(chemGate);
