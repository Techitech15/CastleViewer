  }
};
var WEATHER_STATES = {
  clear:  { sunMul: 1.00, ambientMul: 1.00, fogNearMul: 1.00, fogFarMul: 1.00, skySatMul: 1.00, rain: 0, snow: 0 },
  cloudy: { sunMul: 0.50, ambientMul: 0.82, fogNearMul: 0.82, fogFarMul: 0.68, skySatMul: 0.42, rain: 0, snow: 0 },
  rain:   { sunMul: 0.38, ambientMul: 0.78, fogNearMul: 0.70, fogFarMul: 0.56, skySatMul: 0.34, rain: 1, snow: 0 },
  snow:   { sunMul: 0.58, ambientMul: 0.85, fogNearMul: 0.60, fogFarMul: 0.48, skySatMul: 0.52, rain: 0, snow: 1 }
};

function cloneTimeState(s){
  return {
    sunPos: s.sunPos.clone(), sunColor: s.sunColor.clone(), sunIntensity: s.sunIntensity,
    hemiSky: s.hemiSky.clone(), hemiGround: s.hemiGround.clone(), hemiIntensity: s.hemiIntensity,
    ambientColor: s.ambientColor.clone(), ambientIntensity: s.ambientIntensity,
    fogColor: s.fogColor.clone(), fogNear: s.fogNear, fogFar: s.fogFar,
    sky: s.sky.map(function(c){ return c.clone(); }),
    waterColor: s.waterColor.clone(), windowGlow: s.windowGlow, mountainColor: s.mountainColor.clone()
  };
}
function blendTime(dst, a, b, t){
  dst.sunPos.copy(a.sunPos).lerp(b.sunPos, t);
  dst.sunColor.copy(a.sunColor).lerp(b.sunColor, t);
  dst.sunIntensity = a.sunIntensity + (b.sunIntensity - a.sunIntensity) * t;
  dst.hemiSky.copy(a.hemiSky).lerp(b.hemiSky, t);
  dst.hemiGround.copy(a.hemiGround).lerp(b.hemiGround, t);
  dst.hemiIntensity = a.hemiIntensity + (b.hemiIntensity - a.hemiIntensity) * t;
  dst.ambientColor.copy(a.ambientColor).lerp(b.ambientColor, t);
  dst.ambientIntensity = a.ambientIntensity + (b.ambientIntensity - a.ambientIntensity) * t;
  dst.fogColor.copy(a.fogColor).lerp(b.fogColor, t);
  dst.fogNear = a.fogNear + (b.fogNear - a.fogNear) * t;
  dst.fogFar = a.fogFar + (b.fogFar - a.fogFar) * t;
  for (var i=0;i<6;i++) dst.sky[i].copy(a.sky[i]).lerp(b.sky[i], t);
  dst.waterColor.copy(a.waterColor).lerp(b.waterColor, t);
  dst.windowGlow = a.windowGlow + (b.windowGlow - a.windowGlow) * t;
  dst.mountainColor.copy(a.mountainColor).lerp(b.mountainColor, t);
}
function cloneWeatherState(s){
  return { sunMul:s.sunMul, ambientMul:s.ambientMul, fogNearMul:s.fogNearMul, fogFarMul:s.fogFarMul, skySatMul:s.skySatMul, rain:s.rain, snow:s.snow };
}
function blendWeather(dst, a, b, t){
  dst.sunMul = a.sunMul + (b.sunMul - a.sunMul) * t;
  dst.ambientMul = a.ambientMul + (b.ambientMul - a.ambientMul) * t;
  dst.fogNearMul = a.fogNearMul + (b.fogNearMul - a.fogNearMul) * t;
  dst.fogFarMul = a.fogFarMul + (b.fogFarMul - a.fogFarMul) * t;
  dst.skySatMul = a.skySatMul + (b.skySatMul - a.skySatMul) * t;
  dst.rain = a.rain + (b.rain - a.rain) * t;
  dst.snow = a.snow + (b.snow - a.snow) * t;
}

var TIME_DURATION = 1.6, WEATHER_DURATION = 1.3;
var CUR_TIME = cloneTimeState(TIME_STATES.day);
var CUR_WEATHER = cloneWeatherState(WEATHER_STATES.clear);
var timeTrans = { key:'day', from: cloneTimeState(TIME_STATES.day), to: TIME_STATES.day, t: 1 };
var weatherTrans = { key:'clear', from: cloneWeatherState(WEATHER_STATES.clear), to: WEATHER_STATES.clear, t: 1 };

// keep the segmented-button UI in sync regardless of caller (real click,
// or the window.__setEnv debug hook used by the quality-gate script)
function syncSegUI(groupId, key){
  var el = document.getElementById(groupId);
  if (!el) return;
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(b){
    b.classList.toggle('active', b.dataset.k === key);
  });
}
function setTimeOfDay(key){
  syncSegUI('timeSeg', key);
  if (!TIME_STATES[key] || (key === timeTrans.key && timeTrans.t >= 1)) return;
  timeTrans.from = cloneTimeState(CUR_TIME); // freeze current interpolated state, not the old preset
  timeTrans.to = TIME_STATES[key];
  timeTrans.t = 0;
  timeTrans.key = key;
}
function setWeather(key){
  syncSegUI('weatherSeg', key);
  if (!WEATHER_STATES[key] || (key === weatherTrans.key && weatherTrans.t >= 1)) return;
  weatherTrans.from = cloneWeatherState(CUR_WEATHER);
  weatherTrans.to = WEATHER_STATES[key];
  weatherTrans.t = 0;
  weatherTrans.key = key;
}
function stepTransitions(dt){
  if (timeTrans.t < 1){
    timeTrans.t = Math.min(1, timeTrans.t + dt / TIME_DURATION);
    blendTime(CUR_TIME, timeTrans.from, timeTrans.to, smoothstep01(0,1,timeTrans.t));
  }
  if (weatherTrans.t < 1){
    weatherTrans.t = Math.min(1, weatherTrans.t + dt / WEATHER_DURATION);
    blendWeather(CUR_WEATHER, weatherTrans.from, weatherTrans.to, smoothstep01(0,1,weatherTrans.t));
  }
}

var SKY_STOPS_POS = [0, 0.30, 0.52, 0.68, 0.84, 1];
var _skyOut = [col(0), col(0), col(0), col(0), col(0), col(0)];
var _tmpGray = col(0);
function desaturate(c, satMul){
  if (satMul >= 0.999) return c;
  var lum = c.r*0.299 + c.g*0.587 + c.b*0.114;
  _tmpGray.setRGB(lum, lum, lum);
  c.lerp(_tmpGray, 1 - satMul);
  return c;
}
function paintSky(){
  var g = skyCtx.createLinearGradient(0,0,0,512);
  for (var i=0;i<6;i++){
    _skyOut[i].copy(CUR_TIME.sky[i]);
    desaturate(_skyOut[i], CUR_WEATHER.skySatMul);
    g.addColorStop(SKY_STOPS_POS[i], '#' + _skyOut[i].getHexString());
  }
  skyCtx.fillStyle = g;
  skyCtx.fillRect(0,0,8,512);
  skyTex.needsUpdate = true;
}

var WARM_GLOW = col(0xffb066);
function applyEnvironment(){
  paintSky();
  sun.position.copy(CUR_TIME.sunPos);
  sun.color.copy(CUR_TIME.sunColor);
  sun.intensity = CUR_TIME.sunIntensity * CUR_WEATHER.sunMul;
  hemi.color.copy(CUR_TIME.hemiSky);
  hemi.groundColor.copy(CUR_TIME.hemiGround);
  hemi.intensity = CUR_TIME.hemiIntensity * CUR_WEATHER.ambientMul;
  fill.color.copy(CUR_TIME.ambientColor);
  fill.intensity = CUR_TIME.ambientIntensity * CUR_WEATHER.ambientMul;
  scene.fog.color.copy(CUR_TIME.fogColor);
  desaturate(scene.fog.color, CUR_WEATHER.skySatMul);
  scene.fog.near = CUR_TIME.fogNear * CUR_WEATHER.fogNearMul;
  scene.fog.far = Math.max(scene.fog.near + 20, CUR_TIME.fogFar * CUR_WEATHER.fogFarMul);
  if (current){
    (current.waterMats || []).forEach(function(m){ m.color.copy(CUR_TIME.waterColor); });
    if (current.windowMat){
      current.windowMat.emissive.copy(WARM_GLOW).multiplyScalar(CUR_TIME.windowGlow * 0.85);
    }
  }
}

/* ---- background mountains: 2-3 low-poly ridgeline rings, one draw call
 * each, merged as a single BufferGeometry per ring (no external merge
 * utility needed since each ring already IS one mesh). Sits well outside
 * the camera's orbit clamp (ZMAX below) so it reads from every azimuth.
 * Colour = per-ring mix of the current time-of-day mountain colour toward
 * the current fog colour (farther ring mixes in more fog = hazier). */
var MOUNTAIN_RINGS = [];
(function buildMountains(){
  var defs = [
    { radius: 340, baseY: -34, peakBase: 26, peakVar: 32, segs: 84, mixToFog: 0.12, seed: 3.1 },
    { radius: 520, baseY: -34, peakBase: 34, peakVar: 44, segs: 72, mixToFog: 0.36, seed: 14.7 },
    { radius: 700, baseY: -34, peakBase: 40, peakVar: 54, segs: 60, mixToFog: 0.62, seed: 27.4 }
  ];
  defs.forEach(function(d, ringIdx){
    var seg = d.segs, pos = [], idxArr = [];
    for (var i=0;i<=seg;i++){
      var a = i/seg * Math.PI*2;
      var ty = d.peakBase + ridgeNoise1D(a, d.seed) * d.peakVar;
      var x = Math.cos(a)*d.radius, z = Math.sin(a)*d.radius;
      pos.push(x, d.baseY, z,  x, ty, z);
    }
    for (i=0;i<seg;i++){
      var b0=i*2, t0=i*2+1, b1=(i+1)*2, t1=(i+1)*2+1;
      idxArr.push(b0,b1,t0,  t0,b1,t1);
    }
    var geo = new T.BufferGeometry();
    geo.setIndex(idxArr);
    geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    var mat = new T.MeshBasicMaterial({ color: 0x7a97a0, fog: true, side: T.DoubleSide });
    var mesh = new T.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.renderOrder = -10 + ringIdx;
    scene.add(mesh);
    MOUNTAIN_RINGS.push({ mesh: mesh, mixToFog: d.mixToFog });
  });
})();
var _mtnTmp = col(0);
function updateMountains(){
  MOUNTAIN_RINGS.forEach(function(r){
    _mtnTmp.copy(CUR_TIME.mountainColor).lerp(CUR_TIME.fogColor, r.mixToFog);
    desaturate(_mtnTmp, CUR_WEATHER.skySatMul);
    r.mesh.material.color.copy(_mtnTmp);
  });
}

/* ---- rain / snow: anchored to the camera's XZ position so the volume
 * always surrounds the viewer (threejs-weather: "anchor the volume in
 * the frustum"). Float32BufferAttribute COPIES the array handed to it,
 * so we keep a reference to attr.array (not the original array) for the
 * per-frame update -- the classic "nothing moves" trap.
 *
 * Rain and snow must read as visibly different weather, not two shades
 * of the same round dot, so they use different primitives: snow is
 * THREE.Points with a soft circular sprite (slow, sideways sway); rain is
 * THREE.LineSegments -- a real 2-vertex streak per drop, pale blue-grey,
 * low opacity, falling far faster than snow -- built directly from the
 * drop's own fall/wind position each frame (drop head = current position,
 * tail = a fixed offset back along the fall+wind direction). */
var WEATHER_REDUCED = reducedMotion;
var RAIN_N = WEATHER_REDUCED ? 260 : 2200;
var SNOW_N = WEATHER_REDUCED ? 200 : 1300;
function makeSoftDotTexture(){
  var c = document.createElement('canvas');
  c.width = c.height = 32;
  var ctx = c.getContext('2d');
  var g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,32,32);
  return new T.CanvasTexture(c);
}
var SNOW_TEX = makeSoftDotTexture();
function buildWeatherPoints(n, spread, height, size, color, opacityMax, tex){
  var arr = new Float32Array(n*3);
  for (var i=0;i<n;i++){
    arr[i*3]   = (Math.random()-0.5)*spread;
    arr[i*3+1] = Math.random()*height;
    arr[i*3+2] = (Math.random()-0.5)*spread;
  }
  var geo = new T.BufferGeometry();
  var attr = new T.Float32BufferAttribute(arr, 3);
  attr.setUsage(T.DynamicDrawUsage);
  geo.setAttribute('position', attr);
  var mat = new T.PointsMaterial({ color: color, map: tex, size: size, transparent: true, opacity: 0, depthWrite: false, sizeAttenuation: true });
  var pts = new T.Points(geo, mat);
  pts.frustumCulled = false;
  pts.visible = false;
  scene.add(pts);
  return { points: pts, mat: mat, arr: attr.array, attr: attr, n: n, spread: spread, height: height, opacityMax: opacityMax };
}
function buildRainStreaks(n, spread, height, opacityMax){
  var arr = new Float32Array(n*3); // logical drop position (head)
  for (var i=0;i<n;i++){
    arr[i*3]   = (Math.random()-0.5)*spread;
    arr[i*3+1] = Math.random()*height;
    arr[i*3+2] = (Math.random()-0.5)*spread;
  }
  var lineArr = new Float32Array(n*2*3); // head+tail per drop, filled every frame
  var geo = new T.BufferGeometry();
  var attr = new T.Float32BufferAttribute(lineArr, 3);
  attr.setUsage(T.DynamicDrawUsage);
  geo.setAttribute('position', attr);
  var mat = new T.LineBasicMaterial({ color: 0x9fb2c2, transparent: true, opacity: 0, depthWrite: false, fog: false });
  var seg = new T.LineSegments(geo, mat);
  seg.frustumCulled = false;
  seg.visible = false;
  scene.add(seg);
  return { seg: seg, mat: mat, arr: arr, lineAttr: attr, n: n, spread: spread, height: height, opacityMax: opacityMax };
}
var RAIN = buildRainStreaks(RAIN_N, 100, 55, 0.42);
var SNOW = buildWeatherPoints(SNOW_N, 110, 60, 0.34, 0xffffff, 0.85, SNOW_TEX);
var _snowSway = 0;
var RAIN_TAIL = 1.7; // metres of streak trailing each drop
function updateWeatherParticles(dt, camX, camZ){
  RAIN.seg.position.set(camX, 0, camZ);
  SNOW.points.position.set(camX, 0, camZ);
  var rainAmt = CUR_WEATHER.rain, snowAmt = CUR_WEATHER.snow;
  RAIN.seg.visible = rainAmt > 0.005;
  SNOW.points.visible = snowAmt > 0.005;
  RAIN.mat.opacity = rainAmt * RAIN.opacityMax;
  SNOW.mat.opacity = snowAmt * SNOW.opacityMax;
  if (rainAmt > 0.005){
    if (!WEATHER_REDUCED){
      var arr = RAIN.arr, fall = 46*dt, wind = 6*dt; // ~11x snow's fall speed
      for (var i=0;i<RAIN.n;i++){
        var iy = i*3+1;
        arr[iy] -= fall;
        arr[iy-1] += wind;
        if (arr[iy] < -2){
          arr[iy] = RAIN.height * (0.6 + Math.random()*0.4);
          arr[iy-1] = (Math.random()-0.5)*RAIN.spread;
          arr[iy+1] = (Math.random()-0.5)*RAIN.spread;
        }
      }
    }
    // rebuild the head/tail line buffer from the drop positions -- tail
    // trails opposite the fall+wind direction so each segment reads as a
    // short streak rather than a dot.
    var src = RAIN.arr, dst = RAIN.lineAttr.array;
    for (var k=0;k<RAIN.n;k++){
      var sx=src[k*3], sy=src[k*3+1], sz=src[k*3+2];
      var d6=k*6;
      dst[d6]=sx; dst[d6+1]=sy; dst[d6+2]=sz;
      dst[d6+3]=sx-0.09; dst[d6+4]=sy+RAIN_TAIL; dst[d6+5]=sz;
    }
    RAIN.lineAttr.needsUpdate = true;
  }
  if (snowAmt > 0.005 && !WEATHER_REDUCED){
    _snowSway += dt;
    var sarr = SNOW.arr, sfall = 4.2*dt;
    for (var j=0;j<SNOW.n;j++){
      var sy2 = j*3+1;
      sarr[sy2] -= sfall;
      sarr[sy2-1] += Math.sin(_snowSway*0.8 + j*0.37) * 0.55 * dt;
      sarr[sy2+1] += Math.cos(_snowSway*0.6 + j*0.53) * 0.4 * dt;
      if (sarr[sy2] < -2){
        sarr[sy2] = SNOW.height * (0.6 + Math.random()*0.4);
        sarr[sy2-1] = (Math.random()-0.5)*SNOW.spread;
        sarr[sy2+1] = (Math.random()-0.5)*SNOW.spread;
      }
    }
    SNOW.attr.needsUpdate = true;
  }
}

/* ====================================================================
 * 4. active castle management (dispose-safe switch)
 * ==================================================================== */
var current = null; // { group, fadeGroups, interiorGroup, info }

function disposeMaterial(mat){
  if (!mat) return;
  if (mat.map) mat.map.dispose();
  mat.dispose();
}
function applyCastle(idx){
  var def = CASTLES[idx];
  if (current){
    current.group.traverse(function(o){
      if (o.geometry) o.geometry.dispose();
      if (o.material){
        if (Array.isArray(o.material)) o.material.forEach(disposeMaterial);
        else disposeMaterial(o.material);
      }
    });
    scene.remove(current.group);
    current = null;
  }
  var built = def.build(T);
  scene.add(built.group);
  current = built;
  currentIdx = idx;

  document.getElementById('castleName').textContent = def.nameJa;
  document.getElementById('castleMeta').textContent = def.flag + ' ' + def.countryJa + ' · ' + def.year + '年';
  document.getElementById('castleDesc').textContent = def.description;
  // reset fade state instantly so a new castle never appears mid-fade
  built.fadeGroups.forEach(function(fg){ setGroupOpacity(fg, 1, true); });
  hideTooltip();
  updateLabelVisibility();
}
var currentIdx = 0;

var select = document.getElementById('castleSelect');
CASTLES.forEach(function(c, i){
  var opt = document.createElement('option');
  opt.value = i; opt.textContent = c.nameJa + ' — ' + c.countryJa + ' (' + c.year + ')';
  select.appendChild(opt);
});
select.addEventListener('change', function(){ applyCastle(parseInt(select.value,10)); });

/* ====================================================================
 * 5. camera controls: orbit (drag/touch) + zoom (wheel/pinch), inertial
 * ==================================================================== */
var TARGET_Y = 6.0;
var ZMIN = 20, ZMAX = 150; // camera distance clamp (metres)
var EL_MIN = 0.05, EL_MAX = 1.25; // elevation clamp (radians)

var orbAz = -Math.PI*0.22, orbEl = 0.42, orbDist = 105;
var curAz = orbAz, curEl = orbEl, curDist = orbDist;

function easeFactor(dt){
  // frame-rate independent damping
  return reducedMotion ? 1 : (1 - Math.pow(0.001, dt));
}
function placeCamera(k){
  curAz += (orbAz - curAz) * k;
  curEl += (orbEl - curEl) * k;
  curDist += (orbDist - curDist) * k;
  var ce = Math.cos(curEl), se = Math.sin(curEl);
  camera.position.set(
    curDist*ce*Math.sin(curAz),
    TARGET_Y + curDist*se,
    curDist*ce*Math.cos(curAz)
  );
  camera.lookAt(0, TARGET_Y*0.55, 0);
}
function layout(){
  var w = window.innerWidth;
  var h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1,h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', layout);

/* -- reveal: normalised 0 (far) .. 1 (near) from camera distance -- */
function computeReveal(){
  var t = (ZMAX - orbDist) / (ZMAX - ZMIN);
  return Math.max(0, Math.min(1, t));
}
var camDir = new T.Vector3();
function updateCamDir(){
  camDir.set(Math.sin(curAz), 0, Math.cos(curAz));
}

var WALL_START = 0.35, WALL_END = 0.58;
// roof fade band pulled down to sit almost on top of the wall band (was
// 0.70-0.86, leaving the roof visibly lingering long after the walls had
// faded) so the roof reads as gone at roughly the same reveal depth the
// camera-facing walls do.
var ROOF_START = 0.40, ROOF_END = 0.62;
var FACE_DOT = 0.25;
function smoothstep(a,b,x){
  if (b<=a) return x<a?0:1;
  var t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}
function setGroupOpacity(fg, op, instant){
  fg.op = op;
  var visible = op > 0.02;
  fg.group.visible = visible;
  if (visible){
    var full = op >= 0.999;
    fg.mat.transparent = !full;
    fg.mat.depthWrite = full;
    fg.mat.opacity = op;
  }
}
function updateFade(reveal, dt){
  if (!current) return;
  var k = reducedMotion ? 1 : easeFactor(dt);
  var anyMid = false, anyRoofGone = false;
  current.fadeGroups.forEach(function(fg){
    var dirFade = 0;
    if (fg.dir){
      var facing = fg.dir.x*camDir.x + fg.dir.z*camDir.z;
      if (facing > FACE_DOT) dirFade = smoothstep(WALL_START, WALL_END, reveal);
    }
    var roofFade = fg.roof ? smoothstep(ROOF_START, ROOF_END, reveal) : 0;
    var fade = Math.max(dirFade, roofFade);
    var targetOp = 1 - fade;
    var nextOp = fg.op + (targetOp - fg.op) * k;
    if (Math.abs(nextOp - targetOp) < 0.003) nextOp = targetOp;
    setGroupOpacity(fg, nextOp);
    if (fade > 0.02 && fade < 0.98) anyMid = true;
    if (fg.roof && roofFade > 0.9) anyRoofGone = true;
  });
  return { anyMid: anyMid, anyRoofGone: anyRoofGone };
}

/* -- pointer / touch / wheel handling -- */
var ptrs = new Map();
var dragging = false, lastX=0, lastY=0, pinchD=0, pinchDist=orbDist;
function ptrDist(){
  var a = Array.from(ptrs.values());
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
}
var touchStart = null; // tap-vs-drag detection for touch tooltip picking
canvas.addEventListener('pointerdown', function(e){
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  try{ canvas.setPointerCapture(e.pointerId); }catch(_e){}
  if (e.pointerType === 'touch'){
    if (ptrs.size === 1) touchStart = {x:e.clientX, y:e.clientY, t:performance.now()};
  } else {
    hideTooltip();
  }
  if (ptrs.size === 2){ dragging=false; pinchD = ptrDist(); pinchDist = orbDist; hideTooltip(); return; }
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', function(e){
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (ptrs.size >= 2){
    var d = ptrDist();
    if (pinchD > 8) orbDist = Math.max(ZMIN, Math.min(ZMAX, pinchDist * (pinchD/d)));
    return;
  }
  if (!dragging){
    if (e.pointerType !== 'touch') doPick(e.clientX, e.clientY);
    return;
  }
  orbAz -= (e.clientX - lastX) * 0.0062;
  orbEl = Math.max(EL_MIN, Math.min(EL_MAX, orbEl - (e.clientY - lastY) * 0.0046));
  lastX = e.clientX; lastY = e.clientY;
  hideTooltip();
});
canvas.addEventListener('pointerleave', function(e){
  if (e.pointerType !== 'touch') hideTooltip();
});
function ptrEnd(e){
  // resolve tap-vs-drag first, but call doPick only after `dragging` below
  // is updated -- doPick bails out while dragging is still true, and a
  // single-pointer tap leaves it true until the ptrs.size===0 branch runs.
  var tapAt = null;
  if (e && e.pointerType === 'touch' && touchStart){
    var dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    if (Math.hypot(dx,dy) < 10 && performance.now() - touchStart.t < 600){
      tapAt = { x: e.clientX, y: e.clientY };
    } else {
      hideTooltip();
    }
    touchStart = null;
  }
  if (e && ptrs.has(e.pointerId)) ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchD = 0;
  if (ptrs.size === 0){ dragging = false; canvas.classList.remove('drag'); }
  else { var a = Array.from(ptrs.values())[0]; lastX=a.x; lastY=a.y; dragging=true; }
  if (tapAt) doPick(tapAt.x, tapAt.y);
}
canvas.addEventListener('pointerup', ptrEnd);
canvas.addEventListener('pointercancel', ptrEnd);
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  var d = e.deltaMode===1 ? e.deltaY*16 : e.deltaY;
  orbDist = Math.max(ZMIN, Math.min(ZMAX, orbDist * Math.exp(d*0.0016)));
  hideTooltip();
}, {passive:false});

/* ====================================================================
 * 5.5 hover / tap tooltip: raycasts ONLY against the current castle's
 * `pickables` array (never the visual meshes), so cost stays flat
 * regardless of scene complexity. Room boxes are only offered once the
 * cutaway has revealed the interior (matches the label fade-in threshold
 * the old sprite system used); structure boxes (towers / gatehouse) are
 * always offered, exterior or not.
 * ==================================================================== */
var raycaster = new T.Raycaster();
var pickNdc = new T.Vector2();
var tooltipEl = document.getElementById('tooltip');
var lastReveal = 0;
function activePickables(){
  if (!current || !current.pickables) return [];
  if (lastReveal > 0.28) return current.pickables;
  return current.pickables.filter(function(p){ return p.userData.pickInfo.kind === 'structure'; });
}
function doPick(clientX, clientY){
  if (!current || dragging || ptrs.size >= 2){ return; }
  var rect = canvas.getBoundingClientRect();
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom){ hideTooltip(); return; }
  pickNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pickNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pickNdc, camera);
  var targets = activePickables();
  var hits = targets.length ? raycaster.intersectObjects(targets, false) : [];
  if (hits.length){
    showTooltip(hits[0].object.userData.pickInfo, clientX, clientY);
  } else {
    hideTooltip();
  }
}
function showTooltip(info, x, y){
  tooltipEl.innerHTML = '<div class="tt-title">' + info.name + '</div><div class="tt-desc">' + info.desc + '</div>';
  tooltipEl.style.display = 'block';
  var pad = 16;
  var rectW = tooltipEl.offsetWidth, rectH = tooltipEl.offsetHeight;
  var left = x + pad, top = y + pad;
  if (left + rectW > window.innerWidth - 8) left = x - rectW - pad;
  if (top + rectH > window.innerHeight - 8) top = y - rectH - pad;
  tooltipEl.style.left = Math.max(4,left) + 'px';
  tooltipEl.style.top = Math.max(4,top) + 'px';
}
function hideTooltip(){ tooltipEl.style.display = 'none'; }

/* ====================================================================
 * 6. reveal indicator UI
 * ==================================================================== */
var dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2')];
var revealText = document.getElementById('revealText');
function updateRevealUI(reveal){
  // stage 2 ("内観") now keys off WALL_END rather than the old ROOF_START:
  // walls and roof fade over roughly the same band (Fix 3), so WALL_END
  // is the meaningful "structure is gone" threshold for both.
  var stage = reveal < WALL_START ? 0 : (reveal < WALL_END ? 1 : 2);
  dots.forEach(function(d,i){ d.classList.toggle('on', i<=stage); });
  revealText.textContent = stage===0 ? '外観' : (stage===1 ? '一部カットアウェイ' : '内観');
}

/* -- always-on room labels toggle: independent of the hover tooltip,
 * gated by the same reveal threshold the room pickables use (0.28) so
 * labels only appear once the cutaway has actually opened the interior
 * up. Re-evaluated every frame (reveal changes continuously) and on
 * toggle/castle-switch. -------------------------------------------- */
var labelsOn = false;
function updateLabelVisibility(){
  if (!current || !current.labelGroup) return;
  current.labelGroup.visible = labelsOn && lastReveal > 0.28;
}
document.getElementById('labelToggle').addEventListener('change', function(){
  labelsOn = this.checked;
  updateLabelVisibility();
});

function wireSeg(id, onPick){
  var el = document.getElementById(id);
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ onPick(btn.dataset.k); });
  });
}
wireSeg('timeSeg', setTimeOfDay);
wireSeg('weatherSeg', setWeather);

/* ====================================================================
 * 7. main loop
 * ==================================================================== */
applyCastle(0);
layout();
placeCamera(1);

stepTransitions(0); applyEnvironment(); updateMountains(); // paint the correct sky before the first frame

var prev = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  var k = reducedMotion ? 1 : (1 - Math.pow(0.001, dt));
  placeCamera(k);
  updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, dt);
  updateRevealUI(reveal);
  updateLabelVisibility();
  stepTransitions(dt);
  applyEnvironment();
  updateMountains();
  updateWeatherParticles(dt, camera.position.x, camera.position.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.getElementById('loading').style.display = 'none';
requestAnimationFrame(frame);

/* ====================================================================
 * 8. debug hooks (do not affect production UI)
 * ==================================================================== */
window.__setZoom = function(t){
  // t: 0 (far) .. 1 (near) -> maps to orbDist, snaps instantly (no easing)
  t = Math.max(0, Math.min(1, t));
  orbDist = ZMAX - t*(ZMAX-ZMIN);
  curDist = orbDist;
  placeCamera(1); updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, 1);
  updateRevealUI(reveal);
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__setOrbit = function(az, el){
  orbAz = az; orbEl = Math.max(EL_MIN, Math.min(EL_MAX, el));
  curAz = orbAz; curEl = orbEl;
  placeCamera(1); updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, 1);
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__applyCastle = applyCastle;
window.__setLabels = function(on){
  // testing helper: toggles always-on labels + syncs the UI checkbox,
  // without requiring a real click.
  labelsOn = !!on;
  document.getElementById('labelToggle').checked = labelsOn;
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__findPickScreen = function(nameSubstr){
  // testing helper: projects the first pickable whose tooltip name
  // contains `nameSubstr` to canvas screen coordinates (CSS pixels).
  if (!current || !current.pickables) return null;
  var hit = current.pickables.filter(function(p){ return p.userData.pickInfo.name.indexOf(nameSubstr) >= 0; })[0];
  if (!hit) return null;
  var v = hit.position.clone().project(camera);
  var rect = canvas.getBoundingClientRect();
  return { x: rect.left + (v.x*0.5+0.5)*rect.width, y: rect.top + (1-(v.y*0.5+0.5))*rect.height };
};
window.__setEnv = function(timeKey, weatherKey, instant){
  // testing helper: switches time-of-day / weather, optionally skipping
  // the cross-fade so quality-gate scripts can iterate combinations fast.
  if (timeKey) setTimeOfDay(timeKey);
  if (weatherKey) setWeather(weatherKey);
  if (instant){
    timeTrans.t = 1; CUR_TIME = cloneTimeState(timeTrans.to);
    weatherTrans.t = 1; CUR_WEATHER = cloneWeatherState(weatherTrans.to);
  }
  stepTransitions(0); applyEnvironment(); updateMountains();
  updateWeatherParticles(0, camera.position.x, camera.position.z);
  renderer.render(scene, camera);
};
window.__pickAt = function(clientX, clientY){ doPick(clientX, clientY); };
window.__scene = scene; window.__camera = camera; window.__renderer = renderer;
})();
</script>
</body>
</html>
