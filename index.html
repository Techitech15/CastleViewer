  RAIN.seg.position.set(camX, 0, camZ);
  SNOW.points.position.set(camX, 0, camZ);
  var rainAmt = CUR_WEATHER.rain, snowAmt = CUR_WEATHER.snow;
  RAIN.seg.visible = rainAmt > 0.005;
  SNOW.points.visible = snowAmt > 0.005;
  RAIN.mat.opacity = rainAmt * RAIN.opacityMax;
  SNOW.mat.opacity = snowAmt * SNOW.opacityMax;
  if (rainAmt > 0.005){
    if (!WEATHER_REDUCED){
      var arr = RAIN.arr, fall = 46*dt, wind = 6*dt; // ~11x snow's fall speed
      for (var i=0;i<RAIN.n;i++){
        var iy = i*3+1;
        arr[iy] -= fall;
        arr[iy-1] += wind;
        if (arr[iy] < -2){
          arr[iy] = RAIN.height * (0.6 + Math.random()*0.4);
          arr[iy-1] = (Math.random()-0.5)*RAIN.spread;
          arr[iy+1] = (Math.random()-0.5)*RAIN.spread;
        }
      }
    }
    // rebuild the head/tail line buffer from the drop positions -- tail
    // trails opposite the fall+wind direction so each segment reads as a
    // short streak rather than a dot.
    var src = RAIN.arr, dst = RAIN.lineAttr.array;
    for (var k=0;k<RAIN.n;k++){
      var sx=src[k*3], sy=src[k*3+1], sz=src[k*3+2];
      var d6=k*6;
      dst[d6]=sx; dst[d6+1]=sy; dst[d6+2]=sz;
      dst[d6+3]=sx-0.09; dst[d6+4]=sy+RAIN_TAIL; dst[d6+5]=sz;
    }
    RAIN.lineAttr.needsUpdate = true;
  }
  if (snowAmt > 0.005 && !WEATHER_REDUCED){
    _snowSway += dt;
    var sarr = SNOW.arr, sfall = 4.2*dt;
    for (var j=0;j<SNOW.n;j++){
      var sy2 = j*3+1;
      sarr[sy2] -= sfall;
      sarr[sy2-1] += Math.sin(_snowSway*0.8 + j*0.37) * 0.55 * dt;
      sarr[sy2+1] += Math.cos(_snowSway*0.6 + j*0.53) * 0.4 * dt;
      if (sarr[sy2] < -2){
        sarr[sy2] = SNOW.height * (0.6 + Math.random()*0.4);
        sarr[sy2-1] = (Math.random()-0.5)*SNOW.spread;
        sarr[sy2+1] = (Math.random()-0.5)*SNOW.spread;
      }
    }
    SNOW.attr.needsUpdate = true;
  }
}

/* ====================================================================
 * 4. active castle management (dispose-safe switch)
 * ==================================================================== */
var current = null; // { group, fadeGroups, interiorGroup, info }

function disposeMaterial(mat){
  if (!mat) return;
  if (mat.map) mat.map.dispose();
  mat.dispose();
}
function applyCastle(idx){
  var def = CASTLES[idx];
  if (current){
    current.group.traverse(function(o){
      if (o.geometry) o.geometry.dispose();
      if (o.material){
        if (Array.isArray(o.material)) o.material.forEach(disposeMaterial);
        else disposeMaterial(o.material);
      }
    });
    scene.remove(current.group);
    current = null;
  }
  var built = def.build(T);
  scene.add(built.group);
  current = built;
  currentIdx = idx;

  document.getElementById('castleName').textContent = def.nameJa;
  document.getElementById('castleMeta').textContent = def.flag + ' ' + def.countryJa + ' · ' + def.year + '年';
  document.getElementById('castleDesc').textContent = def.description;
  // reset fade state instantly so a new castle never appears mid-fade
  built.fadeGroups.forEach(function(fg){ setGroupOpacity(fg, 1, true); });
  hideTooltip();

  // apply this castle's view/env tuning (falls back to Bodiam's own
  // longstanding numbers if a registry entry omits `view` entirely).
  var v = def.view || {};
  TARGET_Y = v.targetY != null ? v.targetY : 6.0;
  ZMIN = v.zMin != null ? v.zMin : 20;
  ZMAX = v.zMax != null ? v.zMax : 150;
  var initDist = v.initDist != null ? v.initDist : 105;
  // snap the orbit distance straight to this castle's starting distance
  // (no easing) so the reveal/cutaway state always starts fresh -- carrying
  // over the previous castle's zoomed-in orbDist would otherwise open the
  // new castle already mid-cutaway, at the wrong scale for its ZMIN/ZMAX.
  orbDist = initDist; curDist = initDist;
  // pan target resets to the origin on every switch (new castle, fresh
  // vantage point) -- instant, same treatment as orbDist/curDist above.
  orbTgtX = 0; orbTgtZ = 0; curTgtX = 0; curTgtZ = 0;
  PAN_LIMIT = v.panLimit != null ? v.panLimit : 40;
  FOG_NEAR_SCALE = (v.fogNear != null ? v.fogNear : 90) / 90;
  FOG_FAR_SCALE = (v.fogFar != null ? v.fogFar : 320) / 320;
  var shadowExtent = v.shadowExtent != null ? v.shadowExtent : 60;
  sun.shadow.camera.left = -shadowExtent; sun.shadow.camera.right = shadowExtent;
  sun.shadow.camera.top = shadowExtent; sun.shadow.camera.bottom = -shadowExtent;
  sun.shadow.camera.far = v.shadowFar != null ? v.shadowFar : 220;
  sun.shadow.camera.updateProjectionMatrix();
  // far-clip plane wasn't previously castle-tunable at all (always the
  // constructor's default 1000) -- Vincennes' background mountain rings,
  // pushed out past ~700m by envScale, need a much larger far plane or
  // they simply never reach the GPU's rasteriser.
  camera.far = v.camFar != null ? v.camFar : 1000;
  camera.updateProjectionMatrix();
  ENV_SCALE = v.envScale != null ? v.envScale : 1;
  // envLift: a rigid vertical shift applied to the (already envScale'd)
  // ring, on top of the uniform radius/height scale. Verified empirically
  // (NDC-space projection of sample ring points through the actual
  // camera, not just hand trigonometry) rather than derived analytically:
  // a naive uniform envScale alone was pushing the visible ring points'
  // projected Y comfortably *above* the top of frame (ndcY > 1) at
  // Vincennes' much larger initDist/curDist, so they read as invisible --
  // envLift nudges the ring down (a *negative* value) until the ridge
  // sits back inside the frustum. The ring's geometric base (local Y=-34,
  // scaled) is always deep underground regardless of sign, so this never
  // produces a visible floating gap. Bodiam's envLift is 0 (or omitted),
  // so this is a no-op for it -- position.y simply gets (re-)set to the
  // same 0 it already is.
  ENV_LIFT = v.envLift != null ? v.envLift : 0;
  MOUNTAIN_RINGS.forEach(function(r){ r.mesh.scale.setScalar(ENV_SCALE); r.mesh.position.y = ENV_LIFT; });

  updateLabelVisibility();
  // 城切替のたびに前の城の住人を破棄し、この城の `life` データから作り
  // 直す(トグルOFF中は regenerateResidents 内で何もしない)。
  regenerateResidents();
}
var currentIdx = 0;

var select = document.getElementById('castleSelect');
CASTLES.forEach(function(c, i){
  var opt = document.createElement('option');
  opt.value = i; opt.textContent = c.nameJa + ' — ' + c.countryJa + ' (' + c.year + ')';
  select.appendChild(opt);
});
select.addEventListener('change', function(){ applyCastle(parseInt(select.value,10)); });

/* ====================================================================
 * 5. camera controls: orbit (drag/touch) + zoom (wheel/pinch), inertial
 * ==================================================================== */
var TARGET_Y = 6.0;
var ZMIN = 20, ZMAX = 150; // camera distance clamp (metres)
var EL_MIN = 0.05, EL_MAX = 1.25; // elevation clamp (radians)

var orbAz = -Math.PI*0.22, orbEl = 0.42, orbDist = 105;
var curAz = orbAz, curEl = orbEl, curDist = orbDist;
// look-at target (ground-plane XZ), pannable via right-drag / shift-drag /
// two-finger drag (section 5.1 below). Eased through the same
// orbX->curX/easeFactor pattern as az/el/dist, and clamped to PAN_LIMIT
// (set per-castle in applyCastle) so panning can't wander off into empty
// field. Reset to the origin on every castle switch (see applyCastle).
var orbTgtX = 0, orbTgtZ = 0;
var curTgtX = orbTgtX, curTgtZ = orbTgtZ;
var PAN_LIMIT = 40;

function easeFactor(dt){
  // frame-rate independent damping
  return reducedMotion ? 1 : (1 - Math.pow(0.001, dt));
}
function placeCamera(k){
  curAz += (orbAz - curAz) * k;
  curEl += (orbEl - curEl) * k;
  curDist += (orbDist - curDist) * k;
  curTgtX += (orbTgtX - curTgtX) * k;
  curTgtZ += (orbTgtZ - curTgtZ) * k;
  var ce = Math.cos(curEl), se = Math.sin(curEl);
  camera.position.set(
    curTgtX + curDist*ce*Math.sin(curAz),
    TARGET_Y + curDist*se,
    curTgtZ + curDist*ce*Math.cos(curAz)
  );
  camera.lookAt(curTgtX, TARGET_Y*0.55, curTgtZ);
}
function layout(){
  var w = window.innerWidth;
  var h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1,h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', layout);

/* -- reveal: normalised 0 (far) .. 1 (near) from camera distance -- */
function computeReveal(){
  var t = (ZMAX - orbDist) / (ZMAX - ZMIN);
  return Math.max(0, Math.min(1, t));
}
var camDir = new T.Vector3();
function updateCamDir(){
  camDir.set(Math.sin(curAz), 0, Math.cos(curAz));
}

var WALL_START = 0.35, WALL_END = 0.58;
// roof fade band pulled down to sit almost on top of the wall band (was
// 0.70-0.86, leaving the roof visibly lingering long after the walls had
// faded) so the roof reads as gone at roughly the same reveal depth the
// camera-facing walls do.
var ROOF_START = 0.40, ROOF_END = 0.62;
// second, deeper cutaway tier -- used by fadeGroups whose descriptor sets
// tier:'inner' (e.g. Vincennes' donjon shell nested inside the outer
// enceinte). Reached only once the outer 'outer'-tier shell has already
// fully faded (WALL_END/ROOF_END below these start points), so the two-
// stage cutaway reads as outer walls first, then the keep. Every fadeGroup
// defaults to tier:'outer' (see setGroupOpacity/updateFade below), so
// castles that never set `tier` -- i.e. Bodiam -- are unaffected.
var DONJON_WALL_START = 0.72, DONJON_WALL_END = 0.90;
var DONJON_ROOF_START = 0.76, DONJON_ROOF_END = 0.92;
var FACE_DOT = 0.25;
function smoothstep(a,b,x){
  if (b<=a) return x<a?0:1;
  var t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}
function setGroupOpacity(fg, op, instant){
  fg.op = op;
  var visible = op > 0.02;
  fg.group.visible = visible;
  if (visible){
    var full = op >= 0.999;
    fg.mat.transparent = !full;
    fg.mat.depthWrite = full;
    fg.mat.opacity = op;
  }
}
function updateFade(reveal, dt){
  if (!current) return;
  var k = reducedMotion ? 1 : easeFactor(dt);
  var anyMid = false, anyRoofGone = false;
  current.fadeGroups.forEach(function(fg){
    var inner = fg.tier === 'inner';
    var dirFade = 0;
    if (fg.dir){
      var facing = fg.dir.x*camDir.x + fg.dir.z*camDir.z;
      if (facing > FACE_DOT) dirFade = smoothstep(inner ? DONJON_WALL_START : WALL_START, inner ? DONJON_WALL_END : WALL_END, reveal);
    }
    var roofFade = fg.roof ? smoothstep(inner ? DONJON_ROOF_START : ROOF_START, inner ? DONJON_ROOF_END : ROOF_END, reveal) : 0;
    var fade = Math.max(dirFade, roofFade);
    var targetOp = 1 - fade;
    var nextOp = fg.op + (targetOp - fg.op) * k;
    if (Math.abs(nextOp - targetOp) < 0.003) nextOp = targetOp;
    setGroupOpacity(fg, nextOp);
    if (fade > 0.02 && fade < 0.98) anyMid = true;
    if (fg.roof && roofFade > 0.9) anyRoofGone = true;
  });
  return { anyMid: anyMid, anyRoofGone: anyRoofGone };
}

/* -- pointer / touch / wheel handling -- */
var ptrs = new Map();
var dragging = false, lastX=0, lastY=0, pinchD=0, pinchDist=orbDist;
var panMode = false; // this drag gesture pans the look-at target instead of orbiting
var pinchMidX=0, pinchMidY=0; // two-finger gesture midpoint, tracked frame-to-frame for pan
function ptrDist(){
  var a = Array.from(ptrs.values());
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
}
function ptrMid(){
  var a = Array.from(ptrs.values());
  return { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
}
/* -- 5.1 pan: right-drag / shift+left-drag (mouse) or two-finger drag
 * (touch, alongside the existing pinch-zoom) move the look-at target
 * across the ground plane, using the camera's own current right vector
 * and its forward vector projected onto the ground (elevation ignored --
 * per spec, vertical drag walks the target forward/back along the
 * ground rather than along the camera's tilted view axis). Scaled by
 * curDist so the on-screen drag-to-world-motion ratio stays constant
 * across zoom levels, matching how az/el already feel zoom-independent. */
var PAN_K = 0.0012;
function clampPan(){
  var d = Math.hypot(orbTgtX, orbTgtZ);
  if (d > PAN_LIMIT){
    var s = PAN_LIMIT / d;
    orbTgtX *= s; orbTgtZ *= s;
  }
}
function panBy(dx, dy){
  var rightX = Math.cos(curAz), rightZ = -Math.sin(curAz);
  var fwdX = -Math.sin(curAz), fwdZ = -Math.cos(curAz); // camera->target, ground-projected
  var scale = curDist * PAN_K;
  orbTgtX -= (rightX*dx + fwdX*dy) * scale;
  orbTgtZ -= (rightZ*dx + fwdZ*dy) * scale;
  clampPan();
}
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
var touchStart = null; // tap-vs-drag detection for touch tooltip picking
canvas.addEventListener('pointerdown', function(e){
  ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  try{ canvas.setPointerCapture(e.pointerId); }catch(_e){}
  if (e.pointerType === 'touch'){
    if (ptrs.size === 1) touchStart = {x:e.clientX, y:e.clientY, t:performance.now()};
  } else {
    hideTooltip();
  }
  if (ptrs.size === 2){
    dragging=false; pinchD = ptrDist(); pinchDist = orbDist;
    var mid0 = ptrMid(); pinchMidX = mid0.x; pinchMidY = mid0.y;
    hideTooltip(); return;
  }
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  panMode = e.pointerType !== 'touch' && (e.button === 2 || (e.button === 0 && e.shiftKey));
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', function(e){
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (ptrs.size >= 2){
    var d = ptrDist();
    if (pinchD > 8) orbDist = Math.max(ZMIN, Math.min(ZMAX, pinchDist * (pinchD/d)));
    // two-finger midpoint drift pans, independent of (and simultaneous
    // with) the distance-drift pinch-zoom handled just above.
    var mid = ptrMid();
    panBy(mid.x - pinchMidX, mid.y - pinchMidY);
    pinchMidX = mid.x; pinchMidY = mid.y;
    return;
  }
  if (!dragging){
    if (e.pointerType !== 'touch') doPick(e.clientX, e.clientY);
    return;
  }
  if (panMode){
    panBy(e.clientX - lastX, e.clientY - lastY);
  } else {
    orbAz -= (e.clientX - lastX) * 0.0062;
    orbEl = Math.max(EL_MIN, Math.min(EL_MAX, orbEl - (e.clientY - lastY) * 0.0046));
  }
  lastX = e.clientX; lastY = e.clientY;
  hideTooltip();
});
canvas.addEventListener('pointerleave', function(e){
  if (e.pointerType !== 'touch') hideTooltip();
});
function ptrEnd(e){
  // resolve tap-vs-drag first, but call doPick only after `dragging` below
  // is updated -- doPick bails out while dragging is still true, and a
  // single-pointer tap leaves it true until the ptrs.size===0 branch runs.
  var tapAt = null;
  if (e && e.pointerType === 'touch' && touchStart){
    var dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    if (Math.hypot(dx,dy) < 10 && performance.now() - touchStart.t < 600){
      tapAt = { x: e.clientX, y: e.clientY };
    } else {
      hideTooltip();
    }
    touchStart = null;
  }
  if (e && ptrs.has(e.pointerId)) ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchD = 0;
  if (ptrs.size === 0){ dragging = false; panMode = false; canvas.classList.remove('drag'); }
  else { var a = Array.from(ptrs.values())[0]; lastX=a.x; lastY=a.y; dragging=true; }
  if (tapAt) doPick(tapAt.x, tapAt.y);
}
canvas.addEventListener('pointerup', ptrEnd);
canvas.addEventListener('pointercancel', ptrEnd);
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  var d = e.deltaMode===1 ? e.deltaY*16 : e.deltaY;
  orbDist = Math.max(ZMIN, Math.min(ZMAX, orbDist * Math.exp(d*0.0016)));
  hideTooltip();
}, {passive:false});

/* ====================================================================
 * 5.5 hover / tap tooltip: raycasts ONLY against the current castle's
 * `pickables` array (never the visual meshes), so cost stays flat
 * regardless of scene complexity. Room boxes are only offered once the
 * cutaway has revealed the interior (matches the label fade-in threshold
 * the old sprite system used); structure boxes (towers / gatehouse) are
 * always offered, exterior or not.
 * ==================================================================== */
var raycaster = new T.Raycaster();
var pickNdc = new T.Vector2();
var tooltipEl = document.getElementById('tooltip');
var lastReveal = 0;
function activePickables(){
  if (!current || !current.pickables) return [];
  if (lastReveal > 0.28) return current.pickables;
  return current.pickables.filter(function(p){ return p.userData.pickInfo.kind === 'structure'; });
}
function doPick(clientX, clientY){
  if (!current || dragging || ptrs.size >= 2){ return; }
  var rect = canvas.getBoundingClientRect();
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom){ hideTooltip(); return; }
  pickNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pickNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pickNdc, camera);
  var targets = activePickables();
  var hits = targets.length ? raycaster.intersectObjects(targets, false) : [];
  if (hits.length){
    showTooltip(hits[0].object.userData.pickInfo, clientX, clientY);
  } else {
    hideTooltip();
  }
}
function showTooltip(info, x, y){
  tooltipEl.innerHTML = '<div class="tt-title">' + info.name + '</div><div class="tt-desc">' + info.desc + '</div>';
  tooltipEl.style.display = 'block';
  var pad = 16;
  var rectW = tooltipEl.offsetWidth, rectH = tooltipEl.offsetHeight;
  var left = x + pad, top = y + pad;
  if (left + rectW > window.innerWidth - 8) left = x - rectW - pad;
  if (top + rectH > window.innerHeight - 8) top = y - rectH - pad;
  tooltipEl.style.left = Math.max(4,left) + 'px';
  tooltipEl.style.top = Math.max(4,top) + 'px';
}
function hideTooltip(){ tooltipEl.style.display = 'none'; }

/* ====================================================================
 * 6. reveal indicator UI
 * ==================================================================== */
var dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2')];
var revealText = document.getElementById('revealText');
function updateRevealUI(reveal){
  // stage 2 ("内観") now keys off WALL_END rather than the old ROOF_START:
  // walls and roof fade over roughly the same band (Fix 3), so WALL_END
  // is the meaningful "structure is gone" threshold for both.
  var stage = reveal < WALL_START ? 0 : (reveal < WALL_END ? 1 : 2);
  dots.forEach(function(d,i){ d.classList.toggle('on', i<=stage); });
  revealText.textContent = stage===0 ? '外観' : (stage===1 ? '一部カットアウェイ' : '内観');
}

/* -- always-on labels toggle: independent of the hover tooltip. Exterior
 * ('structure') labels show as soon as the toggle is on, regardless of
 * reveal -- they're never occluded by the cutaway, and at Vincennes'
 * scale the initial reveal can sit below 0.28 (large ZMAX/ZMIN range)
 * even though the towers are fully visible, so gating them the same way
 * room labels are silently hid them at some castles' default zoom.
 * Interior ('room') labels stay gated behind the same 0.28 reveal
 * threshold the room pickables use, so they don't float visibly through
 * a still-solid wall. Re-evaluated every frame (reveal changes
 * continuously) and on toggle/castle-switch. ------------------------- */
var labelsOn = false;
var _lblPos = new T.Vector3();
function updateLabelVisibility(){
  if (!current || !current.labelGroup) return;
  current.labelGroup.visible = labelsOn;
  if (!labelsOn) return;
  var roomsOk = lastReveal > 0.28;
  current.labelGroup.children.forEach(function(spr){
    var kind = spr.userData.labelKind;
    spr.visible = kind === 'room' ? roomsOk : true;
    if (!spr.visible) return;
    // constant on-screen size: a fixed world height reads fine at Bodiam's
    // 105m but is sub-pixel at Vincennes' 450m, so scale with camera
    // distance instead (0.02·d ≈ 24px tall at any zoom, fov 42)
    spr.getWorldPosition(_lblPos);
    var d = _lblPos.distanceTo(camera.position);
    var h = d * (kind === 'room' ? 0.016 : 0.02);
    spr.scale.set(h * spr.userData.aspect, h, 1);
  });
}
document.getElementById('labelToggle').addEventListener('change', function(){
  labelsOn = this.checked;
  updateLabelVisibility();
});

/* ====================================================================
 * 6.5 住人(村人・衛兵) — 全城共通の汎用システム。
 * 城の build() が返す任意フィールド `life` ({gates, courtyard, patrol,
 * population}) を読んでウェイポイント歩行のNPCを配置する。ジオメトリ/
 * マテリアルは種類ごとに一度だけ生成し(この直下のトップレベル変数)、
 * 城切替やトグルOFFでは個体(THREE.Group)だけを破棄して使い回す --
 * 共有ジオメトリ/マテリアルを毎回 dispose/再生成しないので 1体ごとの
 * コストはゼロに近い。カットアウェイの opacity フェードとは無関係
 * (常に不透明)なので、共有マテリアルへ per-NPC の transparent/opacity
 * を書き込む必要がない。門をまたぐ「歩き去ってフェード消滅」は、その
 * 代わりに一様スケールを 1→0 へ縮めることで表現する(遠ざかりながら
 * 小さくなって消える、という安価な近似)。
 * 衛兵の巡回はすべて y=0(地面)上のウェイポイントで組んである -- 城壁の
 * 上を歩かせると、ズームインで壁がフェードした際に空中に浮いて見える
 * ため、あえて壁沿いの地上ルートにしてある。
 * ==================================================================== */
var NPC_BODY_GEO  = new T.CylinderGeometry(0.16, 0.20, 1.4, 6);
var NPC_HEAD_GEO  = new T.SphereGeometry(0.15, 6, 5);
var NPC_SPEAR_GEO = new T.CylinderGeometry(0.018, 0.028, 1.9, 5);
var FARMER_BODY_MAT = new T.MeshLambertMaterial({ color: 0x8a6a42 }); // 農民: 茶
var FARMER_HEAD_MAT = new T.MeshLambertMaterial({ color: 0xd9ac7c }); // 肌
var GUARD_BODY_MAT  = new T.MeshLambertMaterial({ color: 0x6b7078 }); // 衛兵: 鋼色
var GUARD_HEAD_MAT  = new T.MeshLambertMaterial({ color: 0x555a60 }); // 兜
var SPEAR_MAT       = new T.MeshLambertMaterial({ color: 0x2a2a2a }); // 槍

function makeNpcObject(kind){
  var g = new T.Group();
  var body = new T.Mesh(NPC_BODY_GEO, kind === 'guard' ? GUARD_BODY_MAT : FARMER_BODY_MAT);
  body.position.y = 0.7;
  body.castShadow = true;
  g.add(body);
  var head = new T.Mesh(NPC_HEAD_GEO, kind === 'guard' ? GUARD_HEAD_MAT : FARMER_HEAD_MAT);
  head.position.y = 1.4 + 0.15;
  head.castShadow = true;
  g.add(head);
  if (kind === 'guard'){
    var spear = new T.Mesh(NPC_SPEAR_GEO, SPEAR_MAT);
    spear.position.set(0.24, 1.05, 0.02);
    spear.rotation.z = 0.08;
    spear.castShadow = true;
    g.add(spear);
  }
  return g;
}
function rand(a,b){ return a + Math.random()*(b-a); }
function pickCourtyardPoint(courtyard){
  var rects = (courtyard && courtyard.length) ? courtyard : [{minX:-5,maxX:5,minZ:-5,maxZ:5}];
  var r = rects[Math.floor(Math.random()*rects.length)];
  return { x: rand(r.minX, r.maxX), z: rand(r.minZ, r.maxZ) };
}
// dt駆動の進行方向への向き補間(最短回転方向へ、最大角速度でクランプ)
function faceToward(obj, dx, dz, dt, turnSpeed){
  if (Math.abs(dx) < 1e-5 && Math.abs(dz) < 1e-5) return;
  var targetAngle = Math.atan2(dx, dz);
  var diff = targetAngle - obj.rotation.y;
  while (diff > Math.PI) diff -= Math.PI*2;
  while (diff < -Math.PI) diff += Math.PI*2;
  var maxStep = (turnSpeed || 6) * dt;
  obj.rotation.y += (Math.abs(diff) <= maxStep) ? diff : Math.sign(diff)*maxStep;
}
// waypoint (tx,tz) へ向けて speed*dt だけ進める。到達したら true を返す。
function stepToward(obj, tx, tz, speed, dt){
  var dx = tx - obj.position.x, dz = tz - obj.position.z;
  var dist = Math.hypot(dx, dz);
  if (dist < 0.05) return true;
  var step = Math.min(dist, speed*dt);
  obj.position.x += dx/dist*step;
  obj.position.z += dz/dist*step;
  faceToward(obj, dx, dz, dt, 6);
  return step >= dist - 1e-4;
}
// 門〜消失点区間の進行距離からフェード用スケールを求める(区間後半60%
// だけ 1→0.04 へ縮める。手前側はずっと等身大のまま)。
function gateFadeScale(travelled, vanishDist){
  var fadeStart = vanishDist*0.6;
  if (travelled <= fadeStart) return 1;
  return Math.max(0.04, 1 - (travelled-fadeStart)/(vanishDist-fadeStart));
}

var residentsOn = false;
var residentGroup = new T.Group();
scene.add(residentGroup);
var residents = []; // { obj, kind, state, ... } のフラット配列

// gate.path は「中庭側の内側口 -> (壁/塔/橋を貫く中間waypoint...) -> 場外
// 側の外側口」の中心線を並べた配列(最低2点)。内側口=path[0]、外側口=
// path末尾。'through'/'throughIn' がこの中間区間を等身大のまま順に歩き、
// 開口・橋の通路を実際に通り抜けて見えるようにする(壁や扉をすり抜けな
// い)。'outside' のフェード(場外への消失)は外側口を起点に計測する。
function gateOuterPoint(gate){ return gate.path[gate.path.length-1]; }
function gateInnerPoint(gate){ return gate.path[0]; }
function newFarmer(life){
  var obj = makeNpcObject('farmer');
  var npc = { obj:obj, kind:'farmer', speed: rand(1.0,1.5), idle:0 };
  var startAtGate = life.gates && life.gates.length && Math.random() < 0.3;
  if (startAtGate){
    var gate = life.gates[Math.floor(Math.random()*life.gates.length)];
    var outer = gateOuterPoint(gate);
    var vd = gate.vanishDist || 40;
    var t = rand(0.08, 0.92);
    var travelled = vd*t;
    npc.gate = gate;
    npc.state = Math.random() < 0.5 ? 'outside' : 'returning'; // 橋の途中から半々で出入りを再現
    var dirSign = npc.state === 'outside' ? 1 : -1;
    obj.position.set(outer.x + gate.outDir.x*travelled, 0, outer.z + gate.outDir.z*travelled);
    obj.rotation.y = Math.atan2(gate.outDir.x*dirSign, gate.outDir.z*dirSign);
    obj.scale.setScalar(gateFadeScale(travelled, vd));
  } else {
    var pt = pickCourtyardPoint(life.courtyard);
    obj.position.set(pt.x, 0, pt.z);
    npc.state = 'wander';
    npc.wx = pt.x; npc.wz = pt.z;
    npc.idle = rand(0, 2);
  }
  return npc;
}
function updateFarmer(npc, life, dt){
  var obj = npc.obj;
  if (npc.state === 'wander'){
    if (npc.idle > 0){ npc.idle -= dt; return; }
    if (stepToward(obj, npc.wx, npc.wz, npc.speed, dt)){
      if (life.gates && life.gates.length && Math.random() < 0.12){
        npc.gate = life.gates[Math.floor(Math.random()*life.gates.length)];
        npc.state = 'toGate';
      } else {
        var pt = pickCourtyardPoint(life.courtyard);
        npc.wx = pt.x; npc.wz = pt.z;
        npc.idle = rand(0.6, 3.2); // たまに立ち止まる
      }
    }
  } else if (npc.state === 'toGate'){
    var inner = gateInnerPoint(npc.gate);
    if (stepToward(obj, inner.x, inner.z, npc.speed, dt)){
      npc.pathIdx = 1;
      npc.state = npc.pathIdx < npc.gate.path.length ? 'through' : 'outside';
    }
  } else if (npc.state === 'through'){
    // 開口・橋を実寸のまま歩いて通り抜ける区間(壁や扉をすり抜けない)
    var wp = npc.gate.path[npc.pathIdx];
    if (stepToward(obj, wp.x, wp.z, npc.speed, dt)){
      npc.pathIdx++;
      if (npc.pathIdx >= npc.gate.path.length) npc.state = 'outside';
    }
  } else if (npc.state === 'outside'){
    var g = npc.gate, vd = g.vanishDist || 40, outer = gateOuterPoint(g);
    var tx = outer.x + g.outDir.x*vd, tz = outer.z + g.outDir.z*vd;
    var arrived = stepToward(obj, tx, tz, npc.speed, dt);
    var travelled = Math.hypot(obj.position.x-outer.x, obj.position.z-outer.z);
    obj.scale.setScalar(gateFadeScale(travelled, vd));
    if (arrived){
      obj.visible = false;
      npc.state = 'hidden';
      npc.hiddenT = rand(3, 9);
    }
  } else if (npc.state === 'hidden'){
    npc.hiddenT -= dt;
    if (npc.hiddenT <= 0){
      obj.visible = true;
      obj.scale.setScalar(0.04);
      npc.state = 'returning';
    }
  } else if (npc.state === 'returning'){
    var g2 = npc.gate, vd2 = g2.vanishDist || 40, outer2 = gateOuterPoint(g2);
    var arrived2 = stepToward(obj, outer2.x, outer2.z, npc.speed, dt);
    var travelled2 = Math.hypot(obj.position.x-outer2.x, obj.position.z-outer2.z);
    obj.scale.setScalar(gateFadeScale(travelled2, vd2));
    if (arrived2){
      obj.scale.setScalar(1);
      npc.pathIdx = npc.gate.path.length - 2;
      if (npc.pathIdx >= 0){
        npc.state = 'throughIn';
      } else {
        var pt2b = pickCourtyardPoint(life.courtyard);
        npc.wx = pt2b.x; npc.wz = pt2b.z;
        npc.state = 'wander';
        npc.idle = rand(0.3, 1.5);
      }
    }
  } else if (npc.state === 'throughIn'){
    // 場外から戻り、開口・橋を逆順に実寸のまま歩いて中庭側の内側口へ
    var wp2 = npc.gate.path[npc.pathIdx];
    if (stepToward(obj, wp2.x, wp2.z, npc.speed, dt)){
      npc.pathIdx--;
      if (npc.pathIdx < 0){
        var pt2 = pickCourtyardPoint(life.courtyard);
        npc.wx = pt2.x; npc.wz = pt2.z;
        npc.state = 'wander';
        npc.idle = rand(0.3, 1.5);
      }
    }
  }
}
function newGuard(life, i, count){
  var obj = makeNpcObject('guard');
  var patrol = (life.patrol && life.patrol.length >= 2) ? life.patrol : [[0,0,-3],[0,0,3]];
  var idx = Math.floor((i/count) * patrol.length) % patrol.length;
  var wp = patrol[idx];
  obj.position.set(wp[0], 0, wp[2]);
  return { obj:obj, kind:'guard', speed: rand(0.8,1.1), patrol:patrol, idx:idx };
}
function updateGuard(npc, dt){
  var target = npc.patrol[npc.idx];
  if (stepToward(npc.obj, target[0], target[2], npc.speed, dt)){
    npc.idx = (npc.idx + 1) % npc.patrol.length;
  }
}
function disposeResidents(){
  // 共有ジオメトリ/マテリアルは dispose しない(城を跨いで使い回す) --
  // 個体の THREE.Group を residentGroup から外すだけで十分。
  residents.forEach(function(npc){ residentGroup.remove(npc.obj); });
  residents.length = 0;
}
function regenerateResidents(){
  disposeResidents();
  if (!residentsOn || !current || !current.life) return;
  var life = current.life;
  var pop = life.population || { farmers:8, guards:2 };
  var isNight = timeTrans.key === 'night';
  var farmerCount = isNight ? Math.max(1, Math.round(pop.farmers/3)) : (pop.farmers||0);
  var guardCount = pop.guards || 0;
  var i;
  for (i=0;i<farmerCount;i++) residents.push(newFarmer(life));
  for (i=0;i<guardCount;i++) residents.push(newGuard(life, i, guardCount));
  residents.forEach(function(npc){ residentGroup.add(npc.obj); });
}
function updateResidents(dt){
  if (!residentsOn || !residents.length || !current || !current.life) return;
  var life = current.life;
  residents.forEach(function(npc){
    if (npc.kind === 'guard') updateGuard(npc, dt);
    else updateFarmer(npc, life, dt);
  });
}
document.getElementById('residentToggle').addEventListener('change', function(){
  residentsOn = this.checked;
  regenerateResidents();
});

function wireSeg(id, onPick){
  var el = document.getElementById(id);
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ onPick(btn.dataset.k); });
  });
}
wireSeg('timeSeg', setTimeOfDay);
wireSeg('weatherSeg', setWeather);

/* ====================================================================
 * 7. main loop
 * ==================================================================== */
applyCastle(0);
layout();
placeCamera(1);

stepTransitions(0); applyEnvironment(); updateMountains(); // paint the correct sky before the first frame

var prev = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  var k = reducedMotion ? 1 : (1 - Math.pow(0.001, dt));
  placeCamera(k);
  updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, dt);
  updateRevealUI(reveal);
  updateLabelVisibility();
  updateResidents(dt);
  stepTransitions(dt);
  applyEnvironment();
  updateMountains();
  updateWeatherParticles(dt, camera.position.x, camera.position.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.getElementById('loading').style.display = 'none';
requestAnimationFrame(frame);

/* ====================================================================
 * 8. debug hooks (do not affect production UI)
 * ==================================================================== */
window.__setZoom = function(t){
  // t: 0 (far) .. 1 (near) -> maps to orbDist, snaps instantly (no easing)
  t = Math.max(0, Math.min(1, t));
  orbDist = ZMAX - t*(ZMAX-ZMIN);
  curDist = orbDist;
  placeCamera(1); updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, 1);
  updateRevealUI(reveal);
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__setOrbit = function(az, el){
  orbAz = az; orbEl = Math.max(EL_MIN, Math.min(EL_MAX, el));
  curAz = orbAz; curEl = orbEl;
  placeCamera(1); updateCamDir();
  var reveal = computeReveal();
  lastReveal = reveal;
  updateFade(reveal, 1);
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__applyCastle = applyCastle;
window.__setLabels = function(on){
  // testing helper: toggles always-on labels + syncs the UI checkbox,
  // without requiring a real click.
  labelsOn = !!on;
  document.getElementById('labelToggle').checked = labelsOn;
  updateLabelVisibility();
  renderer.render(scene, camera);
};
window.__setResidents = function(on){
  // testing helper: toggles the 住人 (residents) system + syncs the UI
  // checkbox, without requiring a real click.
  residentsOn = !!on;
  document.getElementById('residentToggle').checked = residentsOn;
  regenerateResidents();
  renderer.render(scene, camera);
};
window.__findPickScreen = function(nameSubstr){
  // testing helper: projects the first pickable whose tooltip name
  // contains `nameSubstr` to canvas screen coordinates (CSS pixels).
  if (!current || !current.pickables) return null;
  var hit = current.pickables.filter(function(p){ return p.userData.pickInfo.name.indexOf(nameSubstr) >= 0; })[0];
  if (!hit) return null;
  var v = hit.position.clone().project(camera);
  var rect = canvas.getBoundingClientRect();
  return { x: rect.left + (v.x*0.5+0.5)*rect.width, y: rect.top + (1-(v.y*0.5+0.5))*rect.height };
};
window.__setEnv = function(timeKey, weatherKey, instant){
  // testing helper: switches time-of-day / weather, optionally skipping
  // the cross-fade so quality-gate scripts can iterate combinations fast.
  if (timeKey) setTimeOfDay(timeKey);
  if (weatherKey) setWeather(weatherKey);
  if (instant){
    timeTrans.t = 1; CUR_TIME = cloneTimeState(timeTrans.to);
    weatherTrans.t = 1; CUR_WEATHER = cloneWeatherState(weatherTrans.to);
  }
  stepTransitions(0); applyEnvironment(); updateMountains();
  updateWeatherParticles(0, camera.position.x, camera.position.z);
  renderer.render(scene, camera);
};
window.__pickAt = function(clientX, clientY){ doPick(clientX, clientY); };
window.__setPan = function(x, z){
  // testing helper: snaps the pan target instantly (no easing), through
  // the same clamp real drag input goes through.
  orbTgtX = x; orbTgtZ = z; clampPan();
  curTgtX = orbTgtX; curTgtZ = orbTgtZ;
  placeCamera(1); updateCamDir();
  renderer.render(scene, camera);
};
window.__panBy = function(dx, dy){
  // testing helper: runs the exact drag-delta pan path (panBy) real
  // pointer input uses, then snaps curTgt to match (no easing lag) so the
  // effect is immediately observable.
  panBy(dx, dy);
  curTgtX = orbTgtX; curTgtZ = orbTgtZ;
  placeCamera(1); updateCamDir();
  renderer.render(scene, camera);
};
window.__debugState = function(){
  return {
    orbTgtX: orbTgtX, orbTgtZ: orbTgtZ, curTgtX: curTgtX, curTgtZ: curTgtZ, PAN_LIMIT: PAN_LIMIT,
    camFar: camera.far, envScale: ENV_SCALE, envLift: ENV_LIFT,
    fogNear: scene.fog.near, fogFar: scene.fog.far,
    cameraPos: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
    mountainRings: MOUNTAIN_RINGS.map(function(r){
      return { scale: r.mesh.scale.x, posY: r.mesh.position.y };
    }),
    residentsOn: residentsOn, residentCount: residents.length,
    residentGroupChildren: residentGroup.children.length
  };
};
window.__stepResidents = function(steps, dt){
  // testing helper: fast-forwards the resident state machine without
  // waiting on real time, then re-renders once. Lets a QA pass catch a
  // farmer mid-gate-passage ('through'/'throughIn') deterministically
  // instead of hoping a burst of screenshots lands on the right frame.
  steps = steps || 1; dt = dt || 0.1;
  for (var i=0;i<steps;i++) updateResidents(dt);
  renderer.render(scene, camera);
};
window.__residentStates = function(){
  // testing helper: dumps each resident's kind/state/position so a QA
  // pass can confirm farmers actually reach 'through'/'throughIn' (i.e.
  // walk the gate opening) rather than only ever 'wander'/'outside'.
  return residents.map(function(npc){
    return { kind: npc.kind, state: npc.state,
      x: npc.obj.position.x, z: npc.obj.position.z, visible: npc.obj.visible };
  });
};
window.__scene = scene; window.__camera = camera; window.__renderer = renderer;
window.__MOUNTAIN_RINGS = MOUNTAIN_RINGS;
})();
</script>
</body>
